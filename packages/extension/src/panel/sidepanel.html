<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlarix</title>
    <!--
      NO INLINE SCRIPT AND NO INLINE STYLE, EVER.

      The manifest deliberately declares no `content_security_policy`, so this
      page runs under MV3's default `script-src 'self'`. That is the policy we
      want; the cost is that an inline handler or a `<style>` block fails
      silently-ish at load with a console violation and no rendered UI, which
      reads as a broken panel rather than as a policy decision. Everything goes
      through sidepanel.css and sidepanel.js.
    -->
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1 class="panel__title">Atlarix</h1>
      </header>

      <section class="panel__body">
        <p class="panel__lede">
          Atlarix drives the browser you are already signed into.
        </p>
        <!--
          Starts disabled and is enabled by sidepanel.ts once it has read the
          stored session. The label is decided there too: a panel that renders
          "Sign in" for a moment to someone who is already signed in is the
          three-state auth bug the launchpad's useAuth docblock records, and the
          cheapest place not to have it is here, by never rendering a guess.
        -->
        <button id="sign-in" class="button" type="button" disabled>
          Sign in
        </button>
        <p id="status" class="panel__status" role="status"></p>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
