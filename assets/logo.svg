\u003csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"\u003e
  \u003cdefs\u003e
    \u003clinearGradient id="atlarix-gradient" x1="0%" y1="0%" x2="100%" y2="100%"\u003e
      \u003cstop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" /\u003e
      \u003cstop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" /\u003e
    \u003c/linearGradient\u003e
    \u003cfilter id="glow"\u003e
      \u003cfeGaussianBlur stdDeviation="2" result="coloredBlur"/\u003e
      \u003cfemerge\u003e
        \u003cfeMergeNode in="coloredBlur"/\u003e
        \u003cfeMergeNode in="SourceGraphic"/\u003e
      \u003c/feMerge\u003e
    \u003c/filter\u003e
  \u003c/defs\u003e
  
  \u003c!-- Background circle --\u003e
  \u003ccircle cx="50" cy="50" r="48" fill="#0F172A"/\u003e
  
  \u003c!-- Letter A design --\u003e
  \u003cg filter="url(#glow)"\u003e
    \u003c!-- Main A shape --\u003e
    \u003cpath d="M 30 70 L 50 25 L 70 70 M 38 60 L 62 60" 
          stroke="url(#atlarix-gradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/\u003e
    
    \u003c!-- Accent dots for "axis" concept --\u003e
    \u003ccircle cx="50" cy="30" r="3" fill="#14B8A6"/\u003e
    \u003ccircle cx="35" cy="65" r="2" fill="#8B5CF6"/\u003e
    \u003ccircle cx="65" cy="65" r="2" fill="#8B5CF6"/\u003e
  \u003c/g\u003e
\u003c/svg\u003e