<svg id="rix" class="rix loading" xmlns="http://www.w3.org/2000/svg" viewBox="20 14 200 136" width="200px" style="width:200px;height:auto;overflow:visible" role="img" aria-label="Rix, the Atlarix ant"><defs><clipPath id="rix-globe"><circle cx="62" cy="80" r="36"/></clipPath></defs><style>
#rix .rix-body{transform-origin:120px 80px}
#rix .rix-needle{transform-origin:198px 30px}
#rix.working .rix-leg-a,#rix.scout .rix-leg-a{animation:rix-swing .75s ease-in-out infinite}
#rix.working .rix-leg-b,#rix.scout .rix-leg-b{animation:rix-swing .75s ease-in-out -.375s infinite}
#rix.loading .rix-leg-a{animation:rix-swing .36s ease-in-out infinite}
#rix.loading .rix-leg-b{animation:rix-swing .36s ease-in-out -.18s infinite}
#rix.working .rix-body,#rix.scout .rix-body{animation:rix-bob .375s ease-in-out infinite}
#rix.loading .rix-body{animation:rix-bob .18s ease-in-out infinite}
#rix.rest .rix-body{transform:translateY(3px)}
#rix.rest .rix-needle{animation:rix-idle 2.4s ease-in-out infinite}
#rix.working .rix-needle,#rix.loading .rix-needle{animation:rix-spin 1.2s linear infinite}
#rix.scout .rix-needle{animation:rix-idle 1.2s ease-in-out infinite}
#rix.found .rix-needle{animation:rix-lock .6s cubic-bezier(.2,1.6,.4,1) both}
#rix.found .rix-body{animation:rix-hop .5s ease-out both}
#rix.found .rix-pupil{fill:#6ee7b7}
@keyframes rix-swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes rix-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes rix-idle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes rix-spin{to{transform:rotate(360deg)}}
@keyframes rix-lock{0%{transform:rotate(-140deg)}100%{transform:rotate(0)}}
@keyframes rix-hop{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#rix *{animation:none!important}}
