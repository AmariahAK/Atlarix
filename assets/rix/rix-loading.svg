px 86px"><path d="M 148 86 L 166 104 L 178 146" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 148 86 L 166 104 L 178 146" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="148" cy="86" r="3.2" fill="#141414" stroke="#10b981" stroke-width="1.6"/><circle cx="166" cy="104" r="3.6" fill="#141414" stroke="#10b981" stroke-width="1.8"/><circle cx="178" cy="146" r="2.6" fill="#10b981"/></g><g class="rix-leg rix-leg-b" style="transform-origin:136px 88px"><path d="M 136 88 L 142 112 L 136 146" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 136 88 L 142 112 L 136 146" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="136" cy="88" r="3.2" fill="#141414" stroke="#10b981" stroke-width="1.6"/><circle cx="142" cy="112" r="3.6" fill="#141414" stroke="#10b981" stroke-width="1.8"/><circle cx="136" cy="146" r="2.6" fill="#10b981"/></g><g class="rix-leg rix-leg-a" style="transform-origin:124px 86px"><path d="M 124 86 L 104 108 L 92 146" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 124 86 L 104 108 L 92 146" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="124" cy="86" r="3.2" fill="#141414" stroke="#10b981" stroke-width="1.6"/><circle cx="104" cy="108" r="3.6" fill="#141414" stroke="#10b981" stroke-width="1.8"/><circle cx="92" cy="146" r="2.6" fill="#10b981"/></g></svg>
