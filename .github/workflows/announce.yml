name: Announce release

# Re-post a release's Discord announcement by hand, for a tag run that skipped
# announce-release. The scripts come from main (an old tag may predate them);
# the changelog is read AT THE TAG, so the post matches what shipped.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v15.0.0"
        required: true

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post Discord announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git show "${TAG}:docs/CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          CHANGELOG_FILE="$RUNNER_TEMP/CHANGELOG.md" bash scripts/ci/announce-discord.sh "$TAG"
