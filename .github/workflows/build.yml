name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Set tag name
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version || 'v0.0.0-manual' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: Atlarix ${{ steps.set_tag.outputs.tag }}
          body: |
            ## Atlarix ${{ steps.set_tag.outputs.tag }}

            ### Downloads
            - **macOS (Apple Silicon)**: `Atlarix-*-arm64.dmg`
            - **macOS (Intel)**: `Atlarix-*-x64.dmg`
            - **Windows**: In development; not included in this release.
            - **Linux**: `.deb`, `.rpm`, or `.AppImage`

            ### Installation Notes
            - **macOS**: Right-click → Open (to bypass Gatekeeper)
            - **Linux**: `chmod +x Atlarix.AppImage && ./Atlarix.AppImage`

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: true
          prerelease: false
          generate_release_notes: true
          repository: AmariahAK/atlarix-releases
          token: ${{ secrets.RELEASES_TOKEN }}

  build-macos:
    needs: create-draft
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [arm64, x64]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Apple certificate required for macOS signing and notarization; job fails if import or verification fails
      - name: Import Apple certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions-keychain build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k actions-keychain build.keychain
          security list-keychains -s "$(pwd)/build.keychain"
          # Verify cert imported — will fail the job if not found
          security find-identity -v -p codesigning build.keychain | grep "Developer ID Application"
          rm certificate.p12

      - name: Verify signing env
        run: |
          echo "APPLE_IDENTITY set: ${{ secrets.APPLE_IDENTITY != '' }}"
          echo "APPLE_ID set: ${{ secrets.APPLE_ID != '' }}"
          echo "APPLE_TEAM_ID set: ${{ secrets.APPLE_TEAM_ID != '' }}"
          echo "APPLE_PASSWORD set: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}"
          security find-identity -v -p codesigning build.keychain

      - name: Build for macOS (${{ matrix.arch }})
        run: |
          security list-keychains -s "$(pwd)/build.keychain"
          security default-keychain -s build.keychain
          security unlock-keychain -p actions-keychain build.keychain
          npm run make -- --arch=${{ matrix.arch }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Upload macOS assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

  build-windows:
    if: false  # Windows signing pending — temporarily disabled. Re-enable when YubiKey and OV cert are ready.
    needs: create-draft
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run make
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Windows assets to release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ needs.create-draft.outputs.tag_name }}"
          mapfile -d '' -t FILES < <(find out/make -type f \( -name "*.exe" -o -name "*.nupkg" \) -print0)
          gh release upload "$TAG" "${FILES[@]}" --repo AmariahAK/atlarix-releases --clobber

  build-linux:
    needs: create-draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build for Linux
        run: npm run make
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Linux assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

  publish-release:
    needs: [create-draft, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish draft release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "https://api.github.com/repos/AmariahAK/atlarix-releases/releases/${{ needs.create-draft.outputs.release_id }}"

  virustotal:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        run: sleep 30

      - name: Get release tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download DMG from atlarix-releases
        run: |
          mkdir -p ./assets
          gh release download ${{ steps.tag.outputs.tag }} \
            --repo AmariahAK/atlarix-releases \
            --pattern "*.dmg" \
            --dir ./assets
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Submit to VirusTotal
        run: |
          for file in ./assets/*.dmg; do
            if [ -f "$file" ]; then
              echo "Submitting $(basename "$file")..."
              RESPONSE=$(curl --silent --request POST \
                --url https://www.virustotal.com/api/v3/files \
                --header "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}" \
                --form "file=@$file")
              echo "$RESPONSE"
              ANALYSIS_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id','N/A'))")
              echo "VirusTotal analysis: https://www.virustotal.com/gui/file-analysis/$ANALYSIS_ID"
            fi
          done