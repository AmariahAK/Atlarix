name: Build & Release (GitHub CLI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for macOS (${{ matrix.arch }})
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run make
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build for Linux
        run: npm run make
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
          retention-days: 1

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Set tag name
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version || 'v0.0.0-manual' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: AmariahAK/atlarix-releases
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          
          # Create release
          gh release create "$TAG" \
            --draft \
            --title "Atlarix $TAG" \
            --notes "## Atlarix $TAG

          ### Downloads
          - **macOS (Apple Silicon)**: \`Atlarix-*-arm64.dmg\`
          - **macOS (Intel)**: \`Atlarix-*-x64.dmg\`
          - **Windows**: \`Atlarix-*-Setup.exe\`
          - **Linux**: \`.deb\`, \`.rpm\`, or \`.AppImage\`

          ### Installation Notes
          - **macOS**: Right-click → Open (to bypass Gatekeeper)
          - **Windows**: Click \"More info\" → \"Run anyway\" if SmartScreen blocks
          - **Linux**: \`chmod +x Atlarix.AppImage && ./Atlarix.AppImage\`

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: AmariahAK/atlarix-releases
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          
          # Upload all artifacts
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.nupkg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) | while read -r file; do
            echo "Uploading $(basename "$file")..."
            gh release upload "$TAG" "$file" --clobber
          done

      - name: Publish release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: AmariahAK/atlarix-releases
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          gh release edit "$TAG" --draft=false