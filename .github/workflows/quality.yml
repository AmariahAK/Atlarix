name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall builds electron + fetches ctags/monaco; not needed for type/lint/tests
      - name: Install dependencies
        run: npm ci --ignore-scripts && npx patch-package

      - name: Type check (tsc)
        run: npm run check:ts

      - name: Lint (oxlint)
        run: npm run check:lint

      - name: Tests (vitest)
        run: npm test

      # Report-only until the knip config is verified clean enough to block on.
      - name: Dead code report (knip)
        run: npx knip --no-progress || true
