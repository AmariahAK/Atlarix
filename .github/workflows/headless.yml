# Build + publish ONLY the Electron-free headless CLI bundle to the
# `headless-bench` PRERELEASE on atlarix-releases. Decoupled from the desktop
# app release (release.yml, v* tags) so testers and the benchmark harness can
# grab a working headless CLI without triggering a full mac/win/linux build.
#
# IMPORTANT: this release MUST stay a prerelease — a normal release becomes
# /releases/latest and would hijack the desktop auto-updater feed the launchpad
# reads. `prerelease: true` below enforces that on every update.

name: Atlarix Headless

on:
  workflow_dispatch:
  push:
    tags:
      - "headless-v*"
      # v14.8.10: also rebuild on every desktop release tag so the
      # headless-bench tarball can never silently go stale (previously a
      # manual runbook step via scripts/build-headless-tarball.sh).
      - "v*"

permissions:
  contents: read

concurrency:
  group: atlarix-headless
  cancel-in-progress: false

env:
  # Public npm only — lockfile must not contain CodeArtifact resolved URLs.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  build-and-publish:
    runs-on: ubuntu-latest # amd64 runner → the script's docker --platform linux/amd64 is native (no qemu)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Node 20 is EOL; `engines.node` is ">=24". Matches the quality job.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Headless bundle is pure-JS esbuild; native deps are packed inside Docker
      # by the tarball script — so postinstall (electron) is not needed.
      - name: Install dependencies
        run: node scripts/verify-npm-lock-registry.mjs && npm ci --ignore-scripts && npx patch-package

      - name: Build headless tarball (Docker linux/amd64)
        run: bash scripts/build-headless-tarball.sh

      - name: Stage a stable-named copy
        run: |
          VER="$(node -p "require('./package.json').version")"
          cp "dist-headless-tarball/atlarix-headless-${VER}.tar.gz" \
             "dist-headless-tarball/atlarix-headless-linux-amd64.tar.gz"
          ls -la dist-headless-tarball/

      # Plain `gh`, NOT softprops/action-gh-release.
      #
      # v14.32.0 broke here, twice: the action called
      # `GET /releases/tags/refs/tags/v14.32.0` — the raw git REF, not a tag name —
      # and got 403 "Resource not accessible by personal access token". The same
      # action, token and target repo succeed in `release.yml`'s create-draft; the
      # only structural difference is that THIS is the one caller whose `tag_name`
      # (`headless-bench`) differs from the ref it was triggered by, which is the
      # path that resolves the ref. It had worked on the previous nine tags, so
      # the trigger was upstream — an unpinned floating major.
      #
      # There is nothing here the action buys us: the tag is fixed, the repo is
      # fixed, the release already exists. `gh` says exactly that and cannot
      # decide to look somewhere else.
      - name: Publish to headless-bench prerelease (atlarix-releases)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: AmariahAK/atlarix-releases
        run: |
          set -uo pipefail
          ls -la dist-headless-tarball/

          # NO READ ANYWHERE IN THIS STEP. That is the whole fix.
          #
          # `RELEASES_TOKEN` can WRITE releases but cannot READ them. Proven on
          # 2026-08-17 by two independent failures pointing the same way while
          # every write succeeded:
          #   * softprops → 403 "Resource not accessible by personal access
          #     token" on GET release-by-tag;
          #   * `gh release view headless-bench` → "not found", for a release that
          #     demonstrably exists and holds 35 assets;
          #   * meanwhile create-draft, twelve asset uploads and `gh release
          #     create` (which got as far as 422 "already exists") all worked.
          # So any create-vs-update decision made by LOOKING FIRST resolves to
          # "absent" and then dies on the uniqueness constraint — which is
          # exactly what `announce-release` did to the v14.32.0 release notes.
          #
          # Upload straight at the tag instead. `--clobber` is load-bearing:
          # without it a duplicate asset name returns 422 that reads as SUCCESS
          # while keeping the OLD file, so the stable URL would go on serving the
          # previous release with nothing to show for it.
          # Retry: this upload deletes the previous asset before writing the new
          # one, so a transient 5xx mid-clobber is a real possibility and is what
          # failed v14.32.0 and v14.33.0 (HTTP 503 on releases/assets/<id>, during
          # a GitHub incident). Worth distinguishing from the permission failure
          # that came before it — that one said "release not found" and no number
          # of retries would have helped.
          uploaded=""
          for attempt in 1 2 3 4 5; do
            if gh release upload headless-bench \
                dist-headless-tarball/atlarix-headless-*.tar.gz \
                --repo "$REPO" --clobber; then
              uploaded=yes
              echo "Uploaded on attempt ${attempt}."
              break
            fi
            echo "::warning::Upload failed (attempt ${attempt}/5) — retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          if [ -z "$uploaded" ]; then
            echo "::error::Could not upload to headless-bench after 5 attempts. If the message above is 'release not found' (rather than a 5xx), the release DOES exist and RELEASES_TOKEN cannot READ releases in ${REPO} — grant it Contents: Read and write. A 5xx instead means GitHub was unavailable; re-run this workflow. See docs/TODO.md."
            exit 1
          fi
          echo "Uploaded to headless-bench:"
          ls -1 dist-headless-tarball/atlarix-headless-*.tar.gz
          # Deliberately NOT reading the release back to confirm — this token
          # cannot, and a failed verification read would fail a successful
          # publish. Verify externally: gh release view headless-bench --repo
          # AmariahAK/atlarix-releases --json assets

  # Publish `atlarix` to npm — the install path a benchmark harness uses
  # (`npm i -g atlarix`), replacing the tarball-from-a-URL that needed an env var
  # set before it would install at all.
  #
  # A SEPARATE job with no `needs`, deliberately. The tarball above is what the
  # existing adapter and testers pull today, and an npm outage, a 2FA expiry or a
  # rejected version must never stop it shipping. Same reasoning that keeps
  # build-msix out of publish-release's needs — except that lesson was learned the
  # other way round, by coupling them and losing a release to it.
  #
  # Tag-only: a workflow_dispatch run must never reach the public registry, since
  # the version comes from package.json and a manual re-run would try to republish
  # a version that already exists (npm rejects that — correctly, but noisily).
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Most of this is waiting for release.yml's platform packages (below).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: node scripts/verify-npm-lock-registry.mjs && npm ci --ignore-scripts && npx patch-package

      # Builds the bundle (with the version injected) and stages
      # packages/headless. Never publishes from the repo root: that package.json
      # is the Electron app's and is marked private for exactly this reason.
      - name: Build and stage the npm package
        run: npm run build:headless:npm

      - name: Show exactly what would be published
        run: npm pack --dry-run
        working-directory: packages/headless

      # The bundle must be runnable, not merely packable — a broken `bin` or a
      # missing runtime asset only shows up when something executes it.
      - name: Smoke the staged bundle
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          OUT="$(node packages/headless/dist-headless/atlarix-headless.mjs --version)"
          echo "reported: ${OUT} / expected: ${VER}"
          [ "$OUT" = "$VER" ] || { echo "::error::--version reported '${OUT}', expected '${VER}'"; exit 1; }
          # The npm entry point (bin/atlarix.js): with no atlarix-<platform>
          # package installed, as here, it must fall back to the Node build.
          VIA_LAUNCHER="$(node packages/headless/bin/atlarix.js --version)"
          [ "$VIA_LAUNCHER" = "$VER" ] || { echo "::error::bin/atlarix.js --version reported '${VIA_LAUNCHER}', expected '${VER}'"; exit 1; }

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships an 11.x npm, but a
      # runner-image change could regress that, and the failure mode is bad: npm
      # would fall back to looking for a token, find none, and fail with an auth
      # error that says nothing about the real cause. Fail loudly instead.
      - name: Require an npm that supports trusted publishing
        run: |
          set -euo pipefail
          NPM_V="$(npm --version)"
          echo "npm ${NPM_V}"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`); process.exit(1); }
          ' "$NPM_V"

      # NO TOKEN. Authentication is OIDC (trusted publishing), configured against
      # this repo + this workflow filename in the package settings on npmjs.com.
      # That is why `id-token: write` below is load-bearing.
      #
      # Chosen over a granular access token deliberately: a token would be a
      # long-lived publish credential in repo secrets, npm caps its lifetime (the
      # UI defaults to 30 days, which would silently break releases a month
      # later), and npm is in the process of restricting tokens that bypass 2FA
      # for direct publishing. OIDC credentials are minted per run and expire with
      # it, so there is nothing to leak, rotate, or forget to renew.
      #
      # NO `--provenance`. Tried explicitly on 14.39.4 and it FAILS the publish:
      # npm signs a statement, writes it to the sigstore transparency log, and the
      # registry then rejects the upload with
      #   422 Unprocessable Entity - Error verifying sigstore provenance bundle
      # because the OIDC path already produces its own provenance and the two
      # collide. Without the flag the publish succeeds but the registry records no
      # attestation either (checked on 14.39.2 and 14.39.3), so provenance simply
      # is not available on this path today. A shipping release beats a badge.
      #
      # Trusted publishing ALSO generates provenance by itself when this repo is
      # public, which it is while a release runs (the Actions-budget flip), and
      # that provenance demands repository.url name this repo, not
      # atlarix-releases: E422 on 15.0.1's first cut. packages/headless sets
      # publishConfig.provenance=false, and so do the platform packages
      # (scripts/build-cli-npm.mjs).
      # `atlarix` only after every `atlarix-<platform>` it points at exists.
      #
      # This workflow runs at tag push; release.yml publishes the platform
      # packages ~40 minutes later. Published in that order (15.0.0, 15.0.1),
      # `npm i -g atlarix` and every cloud run (`npx atlarix@latest`) found no
      # binary for the whole gap. Waiting here keeps the trusted publisher on
      # this file, so nothing changes on npmjs.com.
      - name: Wait for the platform packages
        working-directory: packages/headless
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          PKGS="$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')")"
          [ -n "$PKGS" ] || { echo "::error::no platform packages in optionalDependencies"; exit 1; }
          deadline=$(( $(date +%s) + 105 * 60 ))
          for p in $PKGS; do
            until [ "$(npm view "${p}@${VER}" version 2>/dev/null || true)" = "$VER" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::${p}@${VER} never appeared on npm; atlarix@${VER} not published"
                exit 1
              fi
              echo "waiting for ${p}@${VER}…"
              sleep 60
            done
            echo "${p}@${VER} is on npm"
          done

      - name: Publish
        run: npm publish
        working-directory: packages/headless
        # Explicit, so npm honours it: publishConfig.provenance=false alone was
        # IGNORED by trusted publishing's automatic provenance (15.0.1, cut 2).
        env:
          NPM_CONFIG_PROVENANCE: "false"
    permissions:
      contents: read
      id-token: write
