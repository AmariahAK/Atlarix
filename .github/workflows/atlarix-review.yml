# Atlarix PR-review bot. Comment `@atlarix review` on a pull request and the
# prebuilt Electron-free headless Atlarix CLI reviews the diff (read-only) and
# posts the result back as a PR comment.
#
# Required repo config before this does anything:
#   - secret  ATLARIX_REVIEW_API_KEY   the model API key (e.g. OpenRouter)
#   - secret  RELEASES_TOKEN           read access to AmariahAK/atlarix-releases
#                                      (already present — used by release.yml/headless.yml)
#   - var     ATLARIX_REVIEW_MODEL       optional, default deepseek/deepseek-v4-pro
#   - var     ATLARIX_REVIEW_PROVIDER_ID optional, default openrouter
#
# The headless tarball it downloads (headless-bench on atlarix-releases) must be
# rebuilt AFTER the --output-file CLI flag lands — trigger the "Atlarix Headless"
# workflow once (workflow_dispatch) so the bot can capture the review text.

name: Atlarix PR Review

on:
  issue_comment:
    types: [created]

# Only what the bot needs: read the code, write a PR comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: atlarix-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # PR comments only, mentioning the bot, from trusted authors (blocks randos
    # triggering paid runs / prompt-injecting via comment body).
    if: >-
      ${{ github.event.issue.pull_request &&
          contains(github.event.comment.body, '@atlarix review') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      REVIEW_MODEL: ${{ vars.ATLARIX_REVIEW_MODEL || 'deepseek/deepseek-v4-pro' }}
      REVIEW_PROVIDER_ID: ${{ vars.ATLARIX_REVIEW_PROVIDER_ID || 'openrouter' }}
    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,baseRefName)
          echo "head_sha=$(echo "$data" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          echo "base=$(echo "$data" | jq -r .baseRefName)" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Compute diff
        run: |
          git fetch origin "${{ steps.pr.outputs.base }}"
          git diff "origin/${{ steps.pr.outputs.base }}...HEAD" > /tmp/pr.diff
          echo "diff lines: $(wc -l < /tmp/pr.diff)"

      # Node 22: the tarball's better-sqlite3 is built against the Node 22 ABI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download headless Atlarix
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          mkdir -p /tmp/atlarix
          gh release download headless-bench \
            --repo AmariahAK/atlarix-releases \
            --pattern 'atlarix-headless-linux-amd64.tar.gz' \
            --output /tmp/atlarix/headless.tar.gz --clobber
          tar -xzf /tmp/atlarix/headless.tar.gz -C /tmp/atlarix
          test -f /tmp/atlarix/dist-headless/atlarix-headless.mjs

      - name: Build review prompt
        run: |
          {
            cat .github/atlarix/review-prompt.md
            printf '\n\n## Pull request diff\n\n```diff\n'
            cat /tmp/pr.diff
            printf '\n```\n'
          } > /tmp/review-prompt.md

      - name: Run Atlarix review
        working-directory: /tmp/atlarix
        env:
          # The model key is the ONLY secret exposed to the agent step.
          ATLARIX_HEADLESS_API_KEY: ${{ secrets.ATLARIX_REVIEW_API_KEY }}
          ATLARIX_HEADLESS_MODEL: ${{ env.REVIEW_MODEL }}
          ATLARIX_HEADLESS_PROVIDER_ID: ${{ env.REVIEW_PROVIDER_ID }}
        run: |
          node dist-headless/atlarix-headless.mjs \
            --workspace "$GITHUB_WORKSPACE" \
            --prompt-file /tmp/review-prompt.md \
            --mode ask \
            --output-file /tmp/review.md \
            --timeout 900000 || echo "::warning::atlarix-headless exited non-zero (partial review may still be present)"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/review.md ]; then
            echo "_Atlarix produced no review output — check the workflow logs._" > /tmp/review.md
          fi
          {
            echo "### 🤖 Atlarix review"
            echo
            cat /tmp/review.md
            echo
            echo "<sub>Read-only review by headless Atlarix · model \`${REVIEW_MODEL}\` · requested by @${{ github.event.comment.user.login }}</sub>"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
