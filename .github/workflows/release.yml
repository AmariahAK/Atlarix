# Build and publish Atlarix for every version (tag v*).
# Credentials are read from GitHub repository secrets and embedded at build time via Vite define.
# See README "Deployment (CI / GitHub Actions)" for the list of required secrets.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false

permissions:
  contents: write

# Env block for jobs that run npm run make (build-macos, build-linux). No Google/GitHub OAuth — Supabase handles auth.
env:
  LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
  LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
  LEMONSQUEEZY_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_VARIANT_ID }}
  LEMONSQUEEZY_WORKFORCE_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_WORKFORCE_VARIANT_ID }}
  LEMONSQUEEZY_EXTRA_SEAT_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_EXTRA_SEAT_VARIANT_ID }}
  LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  AUTH0_TOKEN_VAULT_ID: ${{ secrets.AUTH0_TOKEN_VAULT_ID }}
  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  COMPASS_OPENROUTER_API_KEY: ${{ secrets.COMPASS_OPENROUTER_API_KEY }}
  COMPASS_MODEL_FAST: ${{ secrets.COMPASS_MODEL_FAST }}
  COMPASS_MODEL_BALANCED: ${{ secrets.COMPASS_MODEL_BALANCED }}
  COMPASS_MODEL_THINKING: ${{ secrets.COMPASS_MODEL_THINKING }}
  GROQ_CLASSIFIER_API_KEY: ${{ secrets.GROQ_CLASSIFIER_API_KEY }}
  GROQ_CLASSIFIER_MODEL: ${{ secrets.GROQ_CLASSIFIER_MODEL }}
  TEMPLATE_TOKEN: ${{ secrets.TEMPLATE_TOKEN }}
  # Opt in to Node 24 action runtime now rather than waiting for the forced migration (June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Stable path for Electron zips so actions/cache can persist them across runs (reduces postinstall 504s).
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  create-draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Set tag name
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version || 'v0.0.0-manual' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: Atlarix ${{ steps.set_tag.outputs.tag }}
          body: |
            ## Atlarix ${{ steps.set_tag.outputs.tag }}

            ### Downloads
            - **macOS (Apple Silicon)**: `Atlarix-*-arm64.dmg`
            - **macOS (Intel)**: `Atlarix-*-x64.dmg`
            - **Windows**: `Atlarix Setup *.exe`
            - **Linux**: `.deb`, `.rpm`, or `.AppImage`

            ### Installation Notes
            - **macOS**: Double-click to install — Apple Notarized, no security warnings.
            - **Linux**: `chmod +x Atlarix.AppImage && ./Atlarix.AppImage`

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: true
          prerelease: false
          generate_release_notes: true
          repository: AmariahAK/atlarix-releases
          token: ${{ secrets.RELEASES_TOKEN }}

  build-macos:
    needs: create-draft
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      matrix:
        arch: [arm64, x64]
      fail-fast: false
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt of 5); removing node_modules and retrying..."
            rm -rf node_modules
            sleep $((attempt * 25))
          done
          echo "npm ci failed after 5 attempts"
          exit 1

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Test and parser benchmarks
        run: npm test && npx tsx scripts/bench-parsers.ts

      - name: Build for macOS (${{ matrix.arch }})
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Notarize macOS app (DMG), staple .app, re-zip stapled bundle, staple DMG
        run: |
          APP=$(find out -type d -name "Atlarix.app" -path "*/Atlarix-darwin-*" | head -1)
          DMG=$(find out/make -name "*.dmg" | head -1)
          ZIP=$(find out/make -name "*.zip" -path "*/zip/darwin/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No Atlarix.app found under out/"
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 90m
          echo "Stapling app bundle..."
          xcrun stapler staple "$APP"
          if [ -n "$ZIP" ]; then
            echo "Re-zipping stapled app to $ZIP ..."
            ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          else
            echo "::warning::No ZIP found under out/make; skipping re-zip."
          fi
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Done — $DMG is signed, notarized, and stapled."
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload macOS assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

      - name: Generate and upload latest-mac.yml (electron-updater feed, arm64 only)
        if: success() && matrix.arch == 'arm64'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          VERSION=$(node -p "require('./package.json').version")
          ZIP=$(find out/make -name "*.zip" -path "*/zip/darwin/*" | head -1)
          DMG=$(find out/make -name "*.dmg" | head -1)
          if [ -z "$ZIP" ] || [ -z "$DMG" ]; then
            echo "Missing ZIP or DMG, skipping latest-mac.yml"
            exit 0
          fi
          ZIP_NAME=$(basename "$ZIP")
          ZIP_SIZE=$(stat -f%z "$ZIP")
          ZIP_SHA512=$(openssl dgst -sha512 -binary "$ZIP" | openssl base64 | tr -d '\n')
          DMG_NAME=$(basename "$DMG")
          DMG_SIZE=$(stat -f%z "$DMG")
          DMG_SHA512=$(openssl dgst -sha512 -binary "$DMG" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-mac.yml << YAML
          version: $VERSION
          files:
            - url: $ZIP_NAME
              sha512: $ZIP_SHA512
              size: $ZIP_SIZE
            - url: $DMG_NAME
              sha512: $DMG_SHA512
              size: $DMG_SIZE
          path: $ZIP_NAME
          sha512: $ZIP_SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          sed -i '' 's/^          //' latest-mac.yml
          echo "--- latest-mac.yml ---"
          cat latest-mac.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-mac.yml \
            "$UPLOAD_URL?name=latest-mac.yml"

  build-linux:
    needs: create-draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # keytar (native module) needs libsecret headers/pkg-config on Linux
          sudo apt-get install -y dpkg fakeroot rpm libsecret-1-dev

      - name: Install appimagetool (required by @reforged/maker-appimage)
        run: |
          wget -q -O /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          # Extract in-place — FUSE is not available in GitHub runners
          /tmp/appimagetool.AppImage --appimage-extract-and-run --help > /dev/null 2>&1 || true
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract > /dev/null 2>&1
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt of 5); removing node_modules and retrying..."
            rm -rf node_modules
            sleep $((attempt * 25))
          done
          echo "npm ci failed after 5 attempts"
          exit 1

      - name: Test and parser benchmarks
        run: npm test && npx tsx scripts/bench-parsers.ts

      - name: Build for Linux
        run: npm run make
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Linux assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

      - name: Generate and upload latest-linux.yml (electron-updater feed)
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          APPIMAGE=$(find out/make -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping latest-linux.yml"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          FILENAME=$(basename "$APPIMAGE")
          SIZE=$(stat -c%s "$APPIMAGE")
          SHA512=$(openssl dgst -sha512 -binary "$APPIMAGE" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-linux.yml << YAML
          version: $VERSION
          files:
            - url: $FILENAME
              sha512: $SHA512
              size: $SIZE
          path: $FILENAME
          sha512: $SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          # Strip leading spaces (heredoc indentation)
          sed -i 's/^          //' latest-linux.yml
          echo "--- latest-linux.yml ---"
          cat latest-linux.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-linux.yml \
            "$UPLOAD_URL?name=latest-linux.yml"

  build-windows:
    needs: create-draft
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 0
          $maxAttempts = 5
          while ($attempts -lt $maxAttempts) {
            $attempts++
            npm ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci succeeded on attempt $attempts"
              exit 0
            }
            Write-Warning "npm ci failed (attempt $attempts of $maxAttempts); retrying..."
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($attempts * 25)
          }
          Write-Error "npm ci failed after $maxAttempts attempts"
          exit 1


      - name: Test and parser benchmarks
        shell: pwsh
        run: npm test; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npx tsx scripts/bench-parsers.ts

      - name: Build for Windows
        shell: pwsh
        run: npm run make
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Windows assets to release
        if: success()
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.exe" -o -name "*.nupkg" \) -print0 | while IFS= read -r -d '' f; do
            BASENAME=$(basename "$f")
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BASENAME")
            echo "Uploading $BASENAME..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$ENCODED"
          done

      - name: Generate and upload latest.yml (electron-updater feed)
        if: success()
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          EXE=$(find out/make -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "No EXE found, skipping latest.yml"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          FILENAME=$(basename "$EXE")
          SIZE=$(wc -c < "$EXE" | tr -d ' ')
          SHA512=$(openssl dgst -sha512 -binary "$EXE" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest.yml << YAML
          version: $VERSION
          files:
            - url: $FILENAME
              sha512: $SHA512
              size: $SIZE
          path: $FILENAME
          sha512: $SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          sed -i 's/^          //' latest.yml
          echo "--- latest.yml ---"
          cat latest.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest.yml \
            "$UPLOAD_URL?name=latest.yml"

  publish-release:
    needs: [create-draft, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish draft release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "https://api.github.com/repos/AmariahAK/atlarix-releases/releases/${{ needs.create-draft.outputs.release_id }}"

