# Quality checks on main/dev/PR; full release build on version tags (v*).
# Credentials are read from GitHub repository secrets and embedded at build time via Vite define.
# See README "Deployment (CI / GitHub Actions)" for the list of required secrets.

name: Atlarix CI

on:
  push:
    # `dev` is the working branch, `main` is the release branch. Both run the
    # `quality` job and NOTHING else: every other job in this file is gated on
    # `startsWith(github.ref, 'refs/tags/v')` or workflow_dispatch, so a push to
    # either branch cannot build or publish a release. Without `dev` here the
    # working branch would run zero CI, which would make it LESS safe than main
    # and defeat the point of having it.
    branches: [main, dev]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false
      npm_only:
        description: "Only publish the atlarix-<platform> npm packages from the published release's CLI archives (no build)"
        type: boolean
        default: false

# Retagging the same version cancels in-progress runs by default; that often aborts
# build-windows during setup-node npm cache restore (no error line, step shows failure).
concurrency:
  group: atlarix-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

# Env block for jobs that run npm run make (build-macos, build-linux). No Google/GitHub OAuth — Supabase handles auth.
# Only values the CLIENT BUILD embeds belong here — this block is the environment
# of `npm run make`, so anything listed is readable by every build script and
# dependency postinstall that runs during packaging.
#
# REMOVED (v14.18.0) because the build never read them, yet they were exposed to
# it on every release: LEMONSQUEEZY_API_KEY, LEMONSQUEEZY_WEBHOOK_SECRET,
# RESEND_API_KEY. All three are server-side only and live where they are used —
# the Supabase edge functions (create-checkout, cancel-subscription, the webhook
# verifier, send-email). `vite.main.config.mts` has always excluded them from the
# embed allowlist; this closes the remaining exposure.
env:
  LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
  LEMONSQUEEZY_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_VARIANT_ID }}
  LEMONSQUEEZY_CREDIT_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_CREDIT_VARIANT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  # Atlarix Core routes through atlarix-proxy — the client embeds only the PUBLIC
  # proxy URL (never a provider key; those live on the proxy). This must be in the
  # build env or a release ships with no Core endpoint.
  #
  # NOT SECRETS. The Core model ids are published in the public
  # `atlarix-releases/core-models.json` and read live by every installed client,
  # and the proxy URL is in every packaged app. They stayed GitHub secrets out of
  # caution, which cost real debugging time: masking them makes CI logs unreadable
  # and breaks env-dependent tests that pass locally. `vars.` keeps them
  # configurable without pretending they are confidential; the `secrets.` fallback
  # lets this work before the repository variables are created.
  ATLARIX_CORE_PROXY_URL: ${{ vars.ATLARIX_CORE_PROXY_URL || secrets.ATLARIX_CORE_PROXY_URL }}
  ATLARIX_CORE_MODEL_1: ${{ vars.ATLARIX_CORE_MODEL_1 || secrets.ATLARIX_CORE_MODEL_1 }}
  ATLARIX_CORE_MODEL_2: ${{ vars.ATLARIX_CORE_MODEL_2 || secrets.ATLARIX_CORE_MODEL_2 }}
  ATLARIX_CORE_MODEL_3: ${{ vars.ATLARIX_CORE_MODEL_3 || secrets.ATLARIX_CORE_MODEL_3 }}
  ATLARIX_CORE_MODEL_4: ${{ vars.ATLARIX_CORE_MODEL_4 || secrets.ATLARIX_CORE_MODEL_4 }}
  # Opt in to Node 24 action runtime now rather than waiting for the forced migration (June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Stable path for Electron zips so actions/cache can persist them across runs (reduces postinstall 504s).
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  # Public npm only — lockfile must not contain CodeArtifact resolved URLs (see scripts/verify-npm-lock-registry.mjs).
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The grep/glob tools shell out to ripgrep; the runner image no longer
      # ships it, so tests that exercise them (glob-secret-denylist) need it here.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Node 20 went EOL in April 2026, and `engines.node` is ">=24". The build
      # jobs below already run 24/25; this one lagged because it only type-checks
      # and tests. Kept at 24 rather than 25: `build-windows` and `msix` pin 24
      # because Node 25 breaks better-sqlite3's `llvm-lib /LTCG:INCREMENTAL` on
      # windows-latest, so 24 is the version every job can agree on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall builds electron; not needed for type/lint/tests
      - name: Install dependencies
        run: node scripts/verify-npm-lock-registry.mjs && npm ci --ignore-scripts && npx patch-package

      # --ignore-scripts skips better-sqlite3's native build. The node vitest
      # project's migration/schema tests (e.g. automations-schema.test.ts) need a
      # real Node-ABI binding, so rebuild just that one prebuilt binary (fast,
      # prebuild-install fetches a matching .node — no source compile). The
      # agent-evals project stays a local gate and self-skips here regardless.
      - name: Rebuild native better-sqlite3 (Node ABI)
        run: npm rebuild better-sqlite3

      - name: Type check (tsc)
        run: npm run check:ts

      # `check:ts` is tsconfig.app.json, whose `include` is ["src", "shared"] —
      # it does not see packages/extension at all, so the package shipped with
      # NO type check in CI. The extension's own tsconfig is the one with
      # `types: []`, and that is the only thing standing between a Node builtin
      # and a bundle that cannot run it. The extension vitest project cannot
      # substitute: jsdom-under-vitest keeps Node's globals, so `Buffer` and
      # `process` resolve there and then fail in Chrome.
      - name: Type check (extension)
        run: npm run ts:extension

      - name: Lint (oxlint)
        run: npm run check:lint

      # The Rust sandbox helpers are `#![cfg(windows)]` / `#![cfg(target_os =
      # "linux")]`, so a plain `cargo build` on the wrong host compiles an EMPTY
      # binary and reports success — which is how the Windows AppContainer helper
      # shipped broken. `cargo check --target <triple>` sets the cfg for real and
      # type-checks the body; it needs no cross-linker because it never links.
      # Behaviour is still the `sandbox` self-test probe's job in the package jobs.
      # Pinned rather than "whatever Rust the runner image ships", so the toolchain
      # that type-checks the sandbox helpers below is the same one on every run.
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Rust targets for the native helpers
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add x86_64-unknown-linux-gnu

      - name: Type check native helpers (cross-target)
        run: npm run check:sandbox

      # Catalog parity across locales, the RTL refusal, and the hardcoded-string
      # ratchet. The ratchet only ever goes DOWN, so this stays green through the
      # string migration instead of being red for the whole of it — a guard that
      # is red for weeks is a guard someone switches off.
      - name: i18n guards
        run: npm run check:i18n

      # The edge functions are the money path and were type-checked by NOTHING.
      # `type ServiceClient = ReturnType<typeof createClient>` resolved the schema
      # generic to `never`, so every .rpc() call was already an error — 23 of them
      # sitting in handle-lemon-webhook, which is exactly the noise floor that
      # hides a real one.
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Type check Supabase edge functions
        run: npm run check:functions

      # NOTE: the agent-evals vitest project is a LOCAL gate — its harness needs
      # a Node-ABI better-sqlite3 (tests/infra) plus a git-mock server and the
      # fake-LLM server that aren't provisioned on CI runners. It self-skips when
      # tests/infra's native binary is absent (see vitest.config.mts), so CI runs
      # the node + renderer projects here; run `npm test` locally for the evals.
      - name: Tests (vitest)
        run: npm test

      # Report-only until the knip config is verified clean enough to block on.
      - name: Dead code report (knip)
        run: npx knip --no-progress || true

  create-draft:
    needs: quality
    if: (github.event_name == 'workflow_dispatch' && !inputs.npm_only) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Set tag name
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version || 'v0.0.0-manual' }}" >> $GITHUB_OUTPUT
          fi

      # Checkout so the REAL changelog can go into the body at creation time.
      # `announce-release` used to edit the notes in afterwards, which needs a
      # READ — and RELEASES_TOKEN cannot read releases, so v14.32.0 shipped with
      # the "See CHANGELOG.md" placeholder. Writing the body here needs no
      # lookup at all.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release body
        id: body
        run: |
          set -uo pipefail
          TAG="${{ steps.set_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          {
            echo "## Atlarix ${TAG}"
            echo ""
            echo "### Downloads"
            echo "- **macOS (Apple Silicon)**: \`Atlarix-*-arm64.dmg\`"
            echo "- **macOS (Intel)**: \`Atlarix-*-x64.dmg\`"
            echo "- **Windows**: \`Atlarix Setup *.exe\`"
            echo "- **Linux**: \`.deb\`, \`.rpm\`, or \`.AppImage\`"
            echo ""
            echo "### Installation Notes"
            echo "- **macOS**: Double-click to install — Apple Notarized, no security warnings."
            echo "- **Linux**: \`chmod +x Atlarix.AppImage && ./Atlarix.AppImage\`"
            echo ""
            echo "---"
            echo ""
          } > release-body.md
          chmod +x scripts/ci/extract-changelog.sh
          ./scripts/ci/extract-changelog.sh "$VERSION" 400 >> release-body.md || true
          # A missing section must be LOUD: the placeholder body is what shipped
          # last time and nobody noticed, because the release itself was fine.
          if [ "$(wc -c < release-body.md)" -lt 700 ]; then
            echo "::warning::No changelog section found for ${VERSION} — the release body is the bare download list. Expected '## [${VERSION}]' in docs/CHANGELOG.md."
          fi
          echo "--- release body ---"
          cat release-body.md

      - name: Create draft release
        id: create_release
        # PINNED to v2.6.2 — what `@v2` resolved to on 2026-08-17, and what this
        # step is known to work on. The floating major is not free: the identical
        # action in headless.yml started failing that day, and nothing on our
        # side had changed. This is the job that publishes releases; it should
        # not move on its own.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: Atlarix ${{ steps.set_tag.outputs.tag }}
          body_path: release-body.md
          draft: true
          prerelease: false
          generate_release_notes: true
          repository: AmariahAK/atlarix-releases
          token: ${{ secrets.RELEASES_TOKEN }}

  build-macos:
    needs: [quality, create-draft]
    if: (github.event_name == 'workflow_dispatch' && !inputs.npm_only) || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      matrix:
        arch: [arm64, x64]
      fail-fast: false
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        shell: bash
        run: |
          node scripts/verify-npm-lock-registry.mjs
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt of 5); removing node_modules and retrying..."
            rm -rf node_modules
            sleep $((attempt * 25))
          done
          echo "npm ci failed after 5 attempts"
          exit 1

      - name: Verify Forge patch applied
        run: node scripts/verify-forge-patch.mjs

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      # The packaged --self-test probes ripgrep (`rg`); the macos-latest (arm64)
      # runner doesn't ship it, so the arm64 self-test failed with `spawn rg ENOENT`.
      # Install it here, mirroring the Windows job's `choco install ripgrep`.
      - name: Install ripgrep
        run: brew install ripgrep

      - name: Tests
        run: npm test

      - name: Build the bridge relay (Rust, ${{ matrix.arch }})
        run: |
          # THE ARCH MUST MATCH THE APP. macos-latest is arm64, so the x64 leg
          # of this matrix CROSS-COMPILES. A plain `cargo build` would place an
          # arm64 binary inside an x64 .app, where it cannot exec — and the
          # symptom is "the bridge does not work", not "the wrong binary", which
          # is a long way from the cause.
          case "${{ matrix.arch }}" in
            arm64) TRIPLE=aarch64-apple-darwin ;;
            x64)   TRIPLE=x86_64-apple-darwin ;;
            *) echo "::error::unknown matrix arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          rustup target add "$TRIPLE"
          cargo build --release --target "$TRIPLE" \
            --manifest-path native/atlarix-bridge/Cargo.toml

          # forge.config.ts looks in target/release, which is where a NON-cross
          # build lands. Copy rather than teach the config about triples: that
          # same config runs `npm run package` on a developer machine, where
          # there is no triple and the plain path is correct.
          mkdir -p native/atlarix-bridge/target/release
          cp "native/atlarix-bridge/target/$TRIPLE/release/atlarix-bridge" \
             native/atlarix-bridge/target/release/atlarix-bridge

          # HARD FAILURE, deliberately unlike the sandbox helpers'
          # ALLOW_UNSANDBOXED_RELEASE hatch. An unsandboxed build is degraded but
          # usable; a missing relay is a feature that is silently ABSENT, and
          # absent is indistinguishable from dormant once it has shipped.
          test -x native/atlarix-bridge/target/release/atlarix-bridge
          # Printed so the arch is in the log rather than inferred from a failure.
          file native/atlarix-bridge/target/release/atlarix-bridge

      - name: Build for macOS (${{ matrix.arch }})
        run: |
          set -euo pipefail
          npm run clean
          npm run ci:package -- --arch=${{ matrix.arch }}
          node scripts/verify-ci-package-out.mjs --stage package --platform darwin --arch ${{ matrix.arch }}
          # Packaged smoke: launch the real binary --self-test (pty spawn, worker
          # resolution, rg) — catches packaged-only breakages the static
          # verifier can't. Only x64 CI runners can execute an arm64 bin natively,
          # so run the self-test only when the build arch matches the runner.
          if [ "${{ matrix.arch }}" = "$(node -p process.arch)" ]; then
            # On failure, dump what a SIGNED build can fail on and a local build
            # cannot: the signature, the entitlements actually applied, and anything
            # the kernel said. This is how v14.35.0's SIGKILL was diagnosed — the
            # arm64 build died in 75ms having printed nothing, and none of it was
            # recoverable afterwards because the app goes with the runner.
            #
            # `codesign -v` alone proves nothing here: a binary carrying an
            # entitlement it is not provisioned for is reported VALID and then
            # SIGKILLed on exec. Keep this even while no restricted entitlement is
            # in use — it is the only thing that made a silent kill legible.
            if ! node scripts/run-packaged-self-test.mjs --arch=${{ matrix.arch }}; then
              APP="out/Atlarix-darwin-${{ matrix.arch }}/Atlarix.app"
              echo "::group::signature + entitlements (${APP})"
              codesign -dv --verbose=4 "$APP" 2>&1 || true
              echo "--- entitlements applied to the app bundle:"
              codesign -d --entitlements - --xml "$APP" 2>&1 | plutil -convert xml1 -o - - 2>/dev/null ||                 codesign -d --entitlements - "$APP" 2>&1 || true
              echo "::endgroup::"
              echo "::group::kernel + launch log"
              log show --last 10m --predicate 'process == "Atlarix" OR sender == "kernel" OR sender == "AMFI"' --style compact 2>&1 | grep -iE "atlarix|amfi|entitle|killed" | tail -60 || true
              echo "::endgroup::"
              exit 1
            fi
          else
            echo "::notice::skipping self-test — build arch ${{ matrix.arch }} != runner $(node -p process.arch)"
          fi
          # appdmg@0.6.6 intermittently fails `hdiutil detach /Volumes/Atlarix`
          # ("No such file or directory") when the DMG volume auto-ejects mid-make.
          # Detach any stale Atlarix volume and retry the installers (make) step.
          make_with_retry() {
            for attempt in 1 2 3; do
              for vol in /Volumes/Atlarix*; do
                [ -e "$vol" ] && hdiutil detach -force "$vol" >/dev/null 2>&1 || true
              done
              rm -rf out/make
              if npm run ci:installers -- --arch=${{ matrix.arch }}; then
                return 0
              fi
              echo "::warning::macOS make attempt ${attempt} failed (appdmg/hdiutil flake); retrying…"
              sleep 5
            done
            echo "::error::macOS make failed after 3 attempts"
            return 1
          }
          make_with_retry
          node scripts/verify-ci-package-out.mjs --stage make --platform darwin --arch ${{ matrix.arch }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Notarize macOS app (DMG), staple .app, re-zip stapled bundle, staple DMG
        run: |
          APP=$(find out -type d -name "Atlarix.app" -path "*/Atlarix-darwin-*" | head -1)
          DMG=$(find out/make -name "*.dmg" | head -1)
          ZIP=$(find out/make -name "*.zip" -path "*/zip/darwin/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No Atlarix.app found under out/"
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 90m
          echo "Stapling app bundle..."
          xcrun stapler staple "$APP"
          if [ -n "$ZIP" ]; then
            echo "Re-zipping stapled app to $ZIP ..."
            ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          else
            echo "::warning::No ZIP found under out/make; skipping re-zip."
          fi
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Done — $DMG is signed, notarized, and stapled."
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload macOS assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

      - name: Generate and upload latest-mac.yml (electron-updater feed, arm64 only)
        if: success() && matrix.arch == 'arm64'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          VERSION=$(node -p "require('./package.json').version")
          ZIP=$(find out/make -name "*.zip" -path "*/zip/darwin/*" | head -1)
          DMG=$(find out/make -name "*.dmg" | head -1)
          if [ -z "$ZIP" ] || [ -z "$DMG" ]; then
            echo "Missing ZIP or DMG, skipping latest-mac.yml"
            exit 0
          fi
          ZIP_NAME=$(basename "$ZIP")
          ZIP_SIZE=$(stat -f%z "$ZIP")
          ZIP_SHA512=$(openssl dgst -sha512 -binary "$ZIP" | openssl base64 | tr -d '\n')
          DMG_NAME=$(basename "$DMG")
          DMG_SIZE=$(stat -f%z "$DMG")
          DMG_SHA512=$(openssl dgst -sha512 -binary "$DMG" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-mac.yml << YAML
          version: $VERSION
          files:
            - url: $ZIP_NAME
              sha512: $ZIP_SHA512
              size: $ZIP_SIZE
            - url: $DMG_NAME
              sha512: $DMG_SHA512
              size: $DMG_SIZE
          path: $ZIP_NAME
          sha512: $ZIP_SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          sed -i '' 's/^          //' latest-mac.yml
          echo "--- latest-mac.yml ---"
          cat latest-mac.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-mac.yml \
            "$UPLOAD_URL?name=latest-mac.yml"

  build-linux:
    needs: [quality, create-draft]
    if: (github.event_name == 'workflow_dispatch' && !inputs.npm_only) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # keytar (native module) needs libsecret headers/pkg-config on Linux;
          # xvfb gives the packaged-smoke a virtual display (Electron whenReady).
          sudo apt-get install -y dpkg fakeroot rpm libsecret-1-dev xvfb ripgrep

      - name: Install appimagetool (required by @reforged/maker-appimage)
        run: |
          # The maintained repo (AppImageKit's is retired), with retries: a
          # one-off server error here failed the whole v15.0.0 release once.
          wget -q --tries=5 --waitretry=10 --retry-on-http-error=500,502,503,504 -O /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          # Extract in-place — FUSE is not available in GitHub runners
          /tmp/appimagetool.AppImage --appimage-extract-and-run --help > /dev/null 2>&1 || true
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract > /dev/null 2>&1
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Install dependencies
        run: |
          node scripts/verify-npm-lock-registry.mjs
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt of 5); removing node_modules and retrying..."
            rm -rf node_modules
            sleep $((attempt * 25))
          done
          echo "npm ci failed after 5 attempts"
          exit 1

      - name: Verify Forge patch applied
        run: node scripts/verify-forge-patch.mjs

      - name: Tests
        run: npm test

      - name: Build Linux sandbox helper (Rust)
        run: |
          # FAIL-LOUD: a non-compiling helper ships Linux UNSANDBOXED (silent
          # security regression). Fail the release unless ALLOW_UNSANDBOXED_RELEASE
          # is explicitly set (emergency escape hatch). Fix the crate + re-run.
          BIN="native/atlarix-sandbox-linux/target/release/atlarix-sandbox-linux"
          if cargo build --release --manifest-path native/atlarix-sandbox-linux/Cargo.toml && [ -f "$BIN" ]; then
            echo "Built $BIN (unsigned — Linux needs no code-signing)."
          elif [ "${ALLOW_UNSANDBOXED_RELEASE:-}" = "1" ]; then
            echo "::warning::atlarix-sandbox-linux failed to build, but ALLOW_UNSANDBOXED_RELEASE=1 — shipping WITHOUT the Landlock sandbox (falls back to bwrap / unsandboxed)."
          else
            echo "::error::atlarix-sandbox-linux failed to build — refusing to ship Linux unsandboxed. Fix the crate, or set ALLOW_UNSANDBOXED_RELEASE=1 to override."
            exit 1
          fi
        env:
          ALLOW_UNSANDBOXED_RELEASE: ${{ vars.ALLOW_UNSANDBOXED_RELEASE }}

      - name: Build the bridge relay (Rust)
        run: |
          # No escape hatch, unlike the Landlock helper above — see the macOS job
          # for the reasoning. The crate has no dependencies and builds in ~6s.
          cargo build --release --manifest-path native/atlarix-bridge/Cargo.toml
          test -x native/atlarix-bridge/target/release/atlarix-bridge
          file native/atlarix-bridge/target/release/atlarix-bridge

      - name: Upload Landlock helper for Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: landlock-helper
          path: native/atlarix-sandbox-linux/target/release/atlarix-sandbox-linux
          if-no-files-found: warn
          retention-days: 1

      - name: Build for Linux
        run: |
          set -euo pipefail
          npm run clean
          npm run ci:package
          node scripts/verify-ci-package-out.mjs --stage package --platform linux --arch x64
          npm run ci:installers
          node scripts/verify-ci-package-out.mjs --stage make --platform linux --arch x64
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Linux assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          shopt -s nullglob
          mapfile -t assets < <(find out/make -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \))
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Linux installers under out/make"
            exit 1
          fi
          find out/make -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

      - name: Generate and upload latest-linux.yml (electron-updater feed)
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          APPIMAGE=$(find out/make -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping latest-linux.yml"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          FILENAME=$(basename "$APPIMAGE")
          SIZE=$(stat -c%s "$APPIMAGE")
          SHA512=$(openssl dgst -sha512 -binary "$APPIMAGE" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-linux.yml << YAML
          version: $VERSION
          files:
            - url: $FILENAME
              sha512: $SHA512
              size: $SIZE
          path: $FILENAME
          sha512: $SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          # Strip leading spaces (heredoc indentation)
          sed -i 's/^          //' latest-linux.yml
          echo "--- latest-linux.yml ---"
          cat latest-linux.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-linux.yml \
            "$UPLOAD_URL?name=latest-linux.yml"

  build-windows:
    needs: [quality, create-draft, build-linux]
    if: (github.event_name == 'workflow_dispatch' && !inputs.npm_only) || startsWith(github.ref, 'refs/tags/v')
    # `windows-latest` (= windows-2025-vs2026) since 2026-09-10. It was pinned to
    # windows-2022 because @electron/node-gyp@10.2.0-electron.1 knew Visual Studio up
    # to 2022 only: it found the VS 2026 instance, logged "unsupported version: 18",
    # and reported "Could not find any Visual Studio installation to use".
    #
    # `patches/@electron+node-gyp+10.2.0-electron.1.patch` fixes that, and the fix is
    # now exercised rather than assumed: MSIX run 34461113885 was green end-to-end on
    # this image, with `check-vs-toolchain` reporting versionYear 2026 and toolset
    # v145. The patch discovers the toolset by scanning `PlatformToolsets` instead of
    # mapping it from the MSVC version, which is what v145 vindicates — VS 2022 17.14
    # ships MSVC 14.44 and is still v143, so no such mapping would have produced it.
    #
    # ONE CAVEAT, because this job is not the one that was tested: that run proved the
    # `msix` job, whose steps end at `electron-forge package`. This job additionally
    # runs `electron-forge make` (Squirrel.Windows), which has never run on the 2025
    # image. The shared risk — npm ci, electron-rebuild, node-gyp, VS discovery — is
    # proven; the maker is not. This job gates `publish-release`, so if a tag fails
    # here, re-run the job and revert this one line to `windows-2022` before assuming
    # the maker is broken.
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 25 breaks better-sqlite3 native build on windows-latest (llvm-lib /LTCG:INCREMENTAL).
          node-version: "24"
          # npm cache restore on windows-latest is flaky (tar on C:\npm\cache; fails when a prior run saved cache).

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Install dependencies
        shell: pwsh
        run: |
          node scripts/verify-npm-lock-registry.mjs
          $attempts = 0
          $maxAttempts = 5
          while ($attempts -lt $maxAttempts) {
            $attempts++
            npm ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci succeeded on attempt $attempts"
              exit 0
            }
            Write-Warning "npm ci failed (attempt $attempts of $maxAttempts); retrying..."
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($attempts * 25)
          }
          Write-Error "npm ci failed after $maxAttempts attempts"
          exit 1

      - name: Verify Forge patch applied
        shell: pwsh
        run: node scripts/verify-forge-patch.mjs

      # Fails FAST, and names what was found.
      #
      # The native rebuild does not happen at `npm ci` — it runs inside
      # forge.config.ts, i.e. at the "Package (electron-forge)" step, several minutes
      # of Vite and Rust later. So without this, a Visual Studio the patched node-gyp
      # cannot see surfaces as a late "Could not find any Visual Studio installation
      # to use", a message that names neither node-gyp nor the patch.
      #
      # It also PRINTS the versionYear and toolset that were selected, which is the
      # only honest way to verify the VS 2026 patch: @electron/rebuild buffers
      # node-gyp's output and prints it only on a non-zero exit, so on a green build
      # there is no log to grep and "assert the absence of `unsupported version: 18`"
      # proves nothing.
      - name: Verify Visual Studio toolchain is discoverable
        shell: pwsh
        run: node scripts/check-vs-toolchain.mjs

      - name: Ensure Electron binary (Windows)
        shell: pwsh
        run: node node_modules/electron/install.js
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

      - name: Verify Electron distro zip (Windows)
        shell: pwsh
        run: node scripts/win-ci-electron-zip.mjs --verify
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          $rg = Get-Command rg -ErrorAction SilentlyContinue
          if (-not $rg) {
            Write-Error "rg not on PATH after choco install"
            exit 1
          }
          Write-Host "ripgrep: $($rg.Source)"
          rg --version

      - name: Test and blueprint index benchmarks
        shell: pwsh
        run: |
          # The combined `npm test` has known Windows-only worker/libuv flakes
          # (e.g. a libuv fs-event assertion crashing a tinypool worker →
          # ERR_IPC_CHANNEL_CLOSED). Per-project runs are green; retry the combined
          # run once so a transient worker crash doesn't fail the release build.
          npm test
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::npm test failed (attempt 1) — retrying once (known Windows worker/libuv flake)."
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare packager temp (Windows)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "electron-packager"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.cache/packager-tmp" | Out-Null

      - name: Download Landlock helper for WSL confinement
        uses: actions/download-artifact@v4
        with:
          name: landlock-helper
          path: native/atlarix-sandbox-linux/target/release/
        continue-on-error: true

      - name: Build for Windows (Vite)
        shell: pwsh
        run: |
          npm run clean
          node scripts/win-ci-vite.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Build Windows sandbox helper (Rust)
        shell: pwsh
        env:
          ALLOW_UNSANDBOXED_RELEASE: ${{ vars.ALLOW_UNSANDBOXED_RELEASE }}
        run: |
          # FAIL-LOUD: a non-compiling helper ships Windows UNSANDBOXED (silent
          # security regression). Fail the release unless ALLOW_UNSANDBOXED_RELEASE
          # is set (emergency escape hatch). Signing stays optional — an unsigned
          # helper works identically for sandboxing; the cert only affects SmartScreen.
          cargo build --release --manifest-path native/atlarix-sandbox/Cargo.toml
          $exe = "native/atlarix-sandbox/target/release/atlarix-sandbox.exe"
          if (Test-Path $exe) {
            if ($env:SM_CODE_SIGNING_CERT_SHA1_HASH) {
              & signtool sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $exe
              if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for sandbox helper"; exit $LASTEXITCODE }
            } else {
              Write-Host "No SM_CODE_SIGNING_CERT_SHA1_HASH — shipping atlarix-sandbox.exe unsigned (sandbox works identically)."
            }
            Write-Host "Built sandbox helper: $exe"
          } elseif ($env:ALLOW_UNSANDBOXED_RELEASE -eq "1") {
            Write-Host "::warning::atlarix-sandbox.exe failed to build, but ALLOW_UNSANDBOXED_RELEASE=1 — shipping WITHOUT the Windows sandbox (run_command stays unsandboxed)."
          } else {
            Write-Host "::error::atlarix-sandbox.exe failed to build — refusing to ship Windows unsandboxed. Fix the crate, or set ALLOW_UNSANDBOXED_RELEASE=1 to override."
            exit 1
          }

      - name: Build the bridge relay (Rust)
        shell: pwsh
        run: |
          # No escape hatch — see the macOS job. Signing stays OPTIONAL, exactly
          # as it is for the sandbox helper: an unsigned relay relays identically,
          # and the certificate only affects SmartScreen.
          # The relay's Windows pipe test runs HERE, on real Windows, because it
          # needs a real named pipe: a read pending on one half while the other
          # writes. v14.52.0 shipped a synchronous pipe that deadlocked exactly
          # there, and no macOS or Linux test could see it.
          cargo test --release --manifest-path native/atlarix-bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::atlarix-bridge tests failed on Windows"; exit $LASTEXITCODE }
          cargo build --release --manifest-path native/atlarix-bridge/Cargo.toml
          $exe = "native/atlarix-bridge/target/release/atlarix-bridge.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::atlarix-bridge.exe failed to build — refusing to ship a release whose browser bridge is silently absent."
            exit 1
          }
          if ($env:SM_CODE_SIGNING_CERT_SHA1_HASH) {
            & signtool sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for the bridge relay"; exit $LASTEXITCODE }
          } else {
            Write-Host "No SM_CODE_SIGNING_CERT_SHA1_HASH — shipping atlarix-bridge.exe unsigned (it relays identically)."
          }
          Write-Host "Built bridge relay: $exe"

      - name: Build for Windows (package + installers)
        timeout-minutes: 55
        shell: pwsh
        run: |
          node scripts/win-ci-package.mjs
          if (-not $?) { exit $LASTEXITCODE }
          node scripts/verify-ci-package-out.mjs --stage package --platform win32 --arch x64
          if (-not $?) { exit $LASTEXITCODE }
          # Packaged smoke: launch atlarix.exe --self-test (pty spawn via conpty,
          # worker resolution, rg).
          node scripts/run-packaged-self-test.mjs --arch=x64
          if (-not $?) { exit $LASTEXITCODE }
          node scripts/verify-ci-package-out.mjs --stage make --platform win32 --arch x64
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          TMP: ${{ github.workspace }}/.cache/packager-tmp
          TEMP: ${{ github.workspace }}/.cache/packager-tmp

      - name: Upload Windows assets to release
        if: success()
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          shopt -s nullglob
          # Include the Squirrel `RELEASES` index (no extension): update.electronjs.org
          # reads it + the *-full.nupkg to serve the Windows auto-update feed. Without
          # it the built-in autoUpdater has nothing to download.
          mapfile -t assets < <(find out/make -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \))
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Windows installers under out/make"
            exit 1
          fi
          find out/make -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \) -print0 | while IFS= read -r -d '' f; do
            BASENAME=$(basename "$f")
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BASENAME")
            echo "Uploading $BASENAME..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$ENCODED"
          done

      # NOTE: no latest.yml is generated for Windows. electron-updater's NSIS feed
      # (latest.yml) does NOT match our Squirrel.Windows installers, and the old
      # step also produced a broken url (space vs dot in the asset name). Windows
      # now updates via update-electron-app / update.electronjs.org, which reads
      # the RELEASES index + *-full.nupkg uploaded above — no latest.yml needed.

  # Microsoft Store package. Produces the .msix + .msixupload as a WORKFLOW ARTIFACT
  # for manual submission to Partner Center — deliberately NOT uploaded to
  # atlarix-releases, because the package is unsigned and an unsigned .msix cannot be
  # installed without the signer's certificate. Publishing one would put a broken
  # download on the public releases page.
  #
  # REQUIRED by `publish-release` (see its `needs`, and the owner's rule recorded
  # there). This comment said the opposite for a week after the rule changed on
  # 2026-08-28 — it claimed the job was "deliberately absent" from that list, which
  # is precisely the belief that let v14.38.3 ship desktop-only while Store users,
  # the majority, got nothing. A comment that contradicts the code is worse than no
  # comment: it is read instead of the code.
  #
  # NOT in `announce-release`'s `needs` — that one gates on `publish-release`, which
  # already carries the MSIX requirement transitively.
  #
  # Was workflow_dispatch-only until the packaged-context spike passed on real
  # Windows hardware (8/8 probes inside the MSIX, sandbox assertions included).
  build-msix:
    # build-linux IS a dependency, and not for ordering aesthetics: it is the job
    # that uploads `landlock-helper`, and this one downloads it for WSL
    # confinement. With `needs: [quality]` alone the two ran in parallel and it
    # was a race — lost on the v14.45.0 tag, where msix reached the download at
    # 20:55:35 and build-linux created the artifact at 20:57:05. The download
    # step is `continue-on-error`, so the miss surfaced 2 minutes later and one
    # step removed, as `verify-ci-package-out` reporting a missing
    # `atlarix-sandbox-linux` resource.
    #
    # Latent, not new: it only bites when linux is the slower of the two, so a
    # faster linux run hides it again. Serialising costs wall-clock and buys a
    # release that cannot fail this way.
    needs: [quality, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/msix.yml
    with:
      arch: x64
      # A release build is exactly when the Store wrapper is wanted.
      upload_wrapper: true
    # Called workflows do NOT inherit the caller's `env`, and msix.yml needs the
    # same build-time credentials (Supabase, Lemon Squeezy, Core proxy) that the
    # other build jobs get from the top-level env block.
    secrets: inherit

  build-extension:
    # ══ THE EXTENSION SHIPS WITH EVERY RELEASE (owner, 2026-09-17) ══
    #
    # It used to go out on its own `ext-v*` tag with its own version line. Two
    # release processes for one product meant "which extension goes with this
    # app" was a question somebody had to answer, and the answer lived nowhere.
    # Its version is now the app's (`scripts/sync-extension-version.mjs`, which
    # build-extension.mjs asserts three ways) and the zip is a release asset
    # like any other.
    #
    # THIS JOB IS IN `publish-release`'s `needs`, on the MSIX precedent and for
    # the same reason: a thing that ships on every release is not optional, and
    # v14.38.3 is what "optional" cost — the MSIX job failed, nothing was gated
    # on it, and the majority of users got nothing from a green run. Submitting
    # to the Store is the opposite case and is deliberately NOT gating; see
    # `submit-extension`.
    needs: [quality, create-draft]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-since check diffs against the PREVIOUS tag, and the
          # default shallow clone does not contain it. Without this the check
          # silently falls back to "changed", which re-submits every release —
          # the exact behaviour this job exists to avoid.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `check:ts` is tsconfig.app.json, whose `include` is ["src","shared"] —
      # `packages/extension` is invisible to it, so this is the only type check
      # the shipped extension gets.
      - name: Type check (extension)
        run: npm run ts:extension

      # Supabase/proxy values come from the workflow's top-level `env` block,
      # which jobs in THIS workflow inherit (a called workflow would not).
      - name: Build extension
        run: npm run build:extension

      # Resolved by glob rather than reconstructed, so this workflow never
      # becomes another place that has to know the version.
      - name: Locate the package
        id: pkg
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(packages/extension/dist/atlarix-extension-*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one built zip, found ${#zips[@]}: ${zips[*]:-(none)}" >&2
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Built ${zips[0]} ($(stat -c%s "${zips[0]}") bytes)"

      - name: Upload extension to release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          f="${{ steps.pkg.outputs.zip }}"
          echo "Uploading $(basename "$f")..."
          curl -sS --fail-with-body -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$f" \
            "$UPLOAD_URL?name=$(basename "$f")"

      # Only a REAL change is worth a human reviewer's time, and a submission
      # cannot be recalled. The input set comes from esbuild's metafile, so a
      # change to the shared page kernel — which lives under `src/`, outside the
      # package entirely — counts, and a version-only bump does not.
      - name: Did the extension actually change?
        id: changed
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous v* tag — treating the extension as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing against $prev"
          changed=$(node scripts/extension-changed.mjs "$prev")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Extension changed since $prev: $changed"

  submit-extension:
    # DELIBERATELY NOT IN `publish-release`'s `needs`. Owner's rule: a Store API
    # failure must never block a desktop release. The zip is already attached by
    # then, so a failure here costs the Store submission and nothing else.
    needs: [build-extension]
    # OFF BY DEFAULT, and the default is the point. A Store submission needs
    # dashboard copy — the justifications, single purpose, the host-permission
    # field — that NO CI job can paste, and uploading a package whose copy has
    # not been updated is how an item gets rejected rather than merely delayed.
    # 2026-09-17 made that concrete twice over: the nativeMessaging
    # justification had silently gone stale because it lived only in the
    # dashboard, and a manual submission was in review when this job would have
    # fired and replaced its pending draft.
    #
    # `build-extension` still attaches the zip to every release, which is what
    # "the extension ships with every release" actually meant. Turn this on
    # deliberately: gh variable set CWS_AUTO_SUBMIT --body true
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-extension.outputs.changed == 'true' &&
      vars.CWS_AUTO_SUBMIT == 'true'
    uses: ./.github/workflows/cws.yml
    with:
      target: default
      no_publish: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # The `atlarix` CLI: one self-contained Bun-compiled binary per platform.
  # Each leg runs on a native runner so it can build (and embed) its own
  # Chrome-bridge relay and run the binary before shipping it (scripts/cli-smoke.ts).
  # Archives + .deb/.rpm go to the release draft; the binaries go to an artifact
  # for npm / Homebrew / winget (cli-assets and the publish jobs below).
  # Targets: scripts/cli-targets.mjs.
  # ───────────────────────────────────────────────────────────────────────────
  build-cli:
    needs: [quality, create-draft]
    if: (github.event_name == 'workflow_dispatch' && !inputs.npm_only) || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest, rust: aarch64-apple-darwin }
          - { target: darwin-x64, runner: macos-latest, rust: x86_64-apple-darwin }
          - { target: linux-x64, runner: ubuntu-latest, rust: x86_64-unknown-linux-gnu, nfpm: amd64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, nfpm: arm64 }
          - { target: linux-x64-musl, runner: ubuntu-latest, rust: x86_64-unknown-linux-musl, musl: true }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl, musl: true }
          - { target: windows-x64, runner: windows-latest, rust: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ startsWith(matrix.target, 'windows') && 'atlarix.exe' || 'atlarix' }}
      RELAY: ${{ startsWith(matrix.target, 'windows') && 'atlarix-bridge.exe' || 'atlarix-bridge' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust }}

      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: npm ci
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt); retrying..."
            rm -rf node_modules; sleep $((attempt * 20))
          done
          exit 1

      - name: Build the bridge relay for ${{ matrix.target }}
        run: |
          cargo build --release --target ${{ matrix.rust }} --manifest-path native/atlarix-bridge/Cargo.toml
          RELAY_PATH="native/atlarix-bridge/target/${{ matrix.rust }}/release/$RELAY"
          test -f "$RELAY_PATH"
          echo "ATLARIX_RELAY_PATH=$PWD/$RELAY_PATH" >> "$GITHUB_ENV"

      - name: Build the CLI
        run: |
          eval "$(scripts/ci/fetch-platform-packages.sh ${{ matrix.target }} "$RUNNER_TEMP/cli-packages")"
          mkdir -p out/cli
          bun scripts/build-bun.ts --target bun-${{ matrix.target }} --outfile "out/cli/$EXE"

      - name: Smoke test
        if: ${{ !matrix.musl }}
        run: bun scripts/cli-smoke.ts "out/cli/$EXE"

      - name: Smoke test (musl, in Alpine)
        if: matrix.musl
        # Bun's musl builds link the C++ runtime dynamically: on Alpine that is
        # `apk add libstdc++ libgcc` (the installer says so). Without it the
        # binary fails with "Error relocating … symbol not found" (v15.0.0).
        run: docker run --rm -v "$PWD/out/cli:/cli" alpine:3 sh -c 'apk add --no-cache libstdc++ libgcc >/dev/null && /cli/atlarix --version'

      - name: Sign and notarize (macOS)
        if: startsWith(matrix.target, 'darwin')
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KC="$RUNNER_TEMP/cli-signing.keychain-db"
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --timestamp --options runtime \
            --entitlements packaging/macos/cli-entitlements.plist \
            --sign "$IDENTITY" "out/cli/$EXE"
          codesign --verify --strict --verbose=2 "out/cli/$EXE"
          ditto -c -k "out/cli/$EXE" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 60m
          # A bare binary can't be stapled; Gatekeeper checks the ticket online.
          security delete-keychain "$KC" || true

      - name: Sign (Windows, when a certificate is configured)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        env:
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          if ($env:SM_CODE_SIGNING_CERT_SHA1_HASH) {
            & signtool sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 out/cli/atlarix.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No code-signing certificate configured: atlarix.exe ships unsigned (SmartScreen warns on first run)."
          }

      - name: Package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out/assets
          if [[ "${{ matrix.target }}" == windows* ]]; then
            (cd out/cli && 7z a -tzip "../assets/atlarix-cli-${{ matrix.target }}.zip" atlarix.exe >/dev/null)
          else
            tar -czf "out/assets/atlarix-cli-${{ matrix.target }}.tar.gz" -C out/cli atlarix
          fi
          if [ -n "${{ matrix.nfpm }}" ]; then
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
            export VERSION NFPM_ARCH="${{ matrix.nfpm }}" CLI_BINARY="$PWD/out/cli/atlarix"
            # nfpm expands ${VAR} in fields like version and arch, but NOT in a
            # file's `src` ("glob failed: ${CLI_BINARY}" on v15.0.0), so the
            # config is filled in first.
            envsubst < packaging/nfpm.yaml > out/nfpm.yaml
            "$(go env GOPATH)/bin/nfpm" package --config out/nfpm.yaml --packager deb --target out/assets/
            "$(go env GOPATH)/bin/nfpm" package --config out/nfpm.yaml --packager rpm --target out/assets/
            for f in out/assets/*.deb out/assets/*.rpm; do mv "$f" "out/assets/atlarix-cli-${{ matrix.target }}.${f##*.}"; done
          fi
          ls -la out/assets

      - name: Upload to the release draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          for f in out/assets/*; do
            echo "Uploading $(basename "$f")..."
            curl -fsS --retry 3 -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")" >/dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: atlarix-cli-${{ matrix.target }}
          path: |
            out/cli/${{ env.EXE }}
            out/assets/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # The VS Code extension (packages/vscode), for VS Code, Cursor, Kiro and
  # Windsurf: one VSIX per platform, each carrying THAT platform's CLI from
  # build-cli, so installing it is the whole setup. In publish-release's needs,
  # like the Chrome zip: it ships with every release.
  # ───────────────────────────────────────────────────────────────────────────
  build-vscode:
    needs: [quality, create-draft, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # @types/vscode lives in the package, not the root lockfile.
      - run: npm ci --prefix packages/vscode

      - name: Type check (VS Code extension)
        run: npm run ts:vscode

      - name: Version matches the app
        run: npm run check:extension-version

      - uses: actions/download-artifact@v4
        with:
          pattern: atlarix-cli-*
          path: cli

      - name: Pack one VSIX per platform
        run: |
          set -euo pipefail
          # CLI target -> VS Code's platform name. The musl builds are Alpine's.
          declare -A VSIX=(
            [darwin-arm64]=darwin-arm64 [darwin-x64]=darwin-x64
            [linux-x64]=linux-x64 [linux-arm64]=linux-arm64
            [linux-x64-musl]=alpine-x64 [linux-arm64-musl]=alpine-arm64
            [windows-x64]=win32-x64
          )
          for t in "${!VSIX[@]}"; do
            exe=atlarix; [[ "$t" == windows-* ]] && exe=atlarix.exe
            # upload-artifact keeps paths relative to their common parent (out/).
            node scripts/build-vscode.mjs --target "${VSIX[$t]}" --cli "cli/atlarix-cli-$t/cli/$exe"
          done
          # Windows on ARM runs the x64 CLI under emulation: there is no
          # windows-arm64 CLI build yet, and without this VSIX an ARM Windows
          # machine would be offered nothing.
          node scripts/build-vscode.mjs --target win32-arm64 --cli cli/atlarix-cli-windows-x64/cli/atlarix.exe
          ls -la dist-vscode

      - name: Upload the VSIXs to the release draft
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          for f in dist-vscode/*.vsix; do
            echo "Uploading $(basename "$f")..."
            curl -fsS --retry 3 -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")" >/dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: atlarix-vsix
          path: dist-vscode/*.vsix
          if-no-files-found: error

  submit-vscode:
    # Open VSX (Cursor, Kiro, Windsurf, VSCodium). NOT in publish-release's
    # needs: a registry outage must never block a release, and the VSIXs are
    # already attached to it by then.
    #
    # The VS Code Marketplace is uploaded BY HAND for now
    # (marketplace.visualstudio.com/manage/publishers/atlarix): a Marketplace
    # token needs an Azure DevOps organisation, which needs an Azure
    # subscription. Move to `vsce publish --oidc` once Microsoft enables
    # trusted publishing for the publisher.
    #
    # Off until switched on: gh variable set VSCODE_AUTO_SUBMIT --body true
    needs: [build-vscode]
    if: startsWith(github.ref, 'refs/tags/v') && vars.VSCODE_AUTO_SUBMIT == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: atlarix-vsix
          path: vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          for f in vsix/*.vsix; do
            echo "Publishing $(basename "$f")..."
            npx --yes ovsx@1.2.0 publish "$f" -p "$OVSX_PAT"
          done

  # Checksums for every CLI download (the installers verify against this file),
  # and the Homebrew formula rendered from them.
  cli-assets:
    needs: [create-draft, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: atlarix-cli-*
          path: cli
      - name: SHA256SUMS-cli.txt
        run: |
          mkdir -p sums
          # upload-artifact stores several paths relative to their common
          # parent (out/), so an artifact holds assets/… and cli/…, not out/….
          find cli -path '*/assets/*' -type f -exec cp {} sums/ \;
          (cd sums && sha256sum atlarix-cli-* > ../SHA256SUMS-cli.txt)
          cat SHA256SUMS-cli.txt
      - name: Upload checksums to the release draft
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          curl -fsS --retry 3 -X POST -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/plain" --data-binary @SHA256SUMS-cli.txt \
            "$UPLOAD_URL?name=SHA256SUMS-cli.txt" >/dev/null
      - name: Render the Homebrew formula
        run: node scripts/ci/render-homebrew-formula.mjs "$GITHUB_REF_NAME" SHA256SUMS-cli.txt > atlarix.rb
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-meta
          path: |
            SHA256SUMS-cli.txt
            atlarix.rb

  publish-release:
    # build-msix IS REQUIRED. Owner's rule, 2026-08-28: the MSIX ships on EVERY
    # release, and it is never described as optional.
    #
    # It was absent from this list, and v14.38.3 is what that costs: the MSIX job
    # failed on an npm publication race, `publish-release` did not care, and the
    # desktop release went out while Store users — the MAJORITY of users — got
    # nothing. The run was green apart from one job nobody was gated on, so the
    # gap announced itself to no one.
    #
    # The trade this accepts, stated so it is a choice rather than an accident: a
    # Store or Azure outage now blocks the desktop publish too. That is the
    # correct direction. A release that reaches some platforms and silently skips
    # the biggest one is not a release, and the recovery is a job re-run rather
    # than a new tag.
    needs:
      [
        quality,
        create-draft,
        build-macos,
        build-linux,
        build-windows,
        build-msix,
        build-extension,
        build-cli,
        cli-assets,
        build-vscode,
      ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish draft release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
        run: |
          set -uo pipefail
          # THIS STEP COULD NOT FAIL, AND THAT IS HOW v14.33.0 SHIPPED AS A DRAFT.
          #
          # It was a bare `curl -sS`, which exits 0 on an HTTP error — so a 503
          # from GitHub returned "No server is currently available", the step went
          # green, every other job went green, and the release sat unpublished
          # with all 12 assets attached and nobody able to see it. Nothing else in
          # the pipeline checks, because publishing IS the last thing.
          #
          # So: fail on HTTP error, retry the transient ones, and then CONFIRM the
          # release actually reads back as published rather than trusting the PATCH.
          #
          # `make_latest` is NOT cosmetic and NOT implied by publishing. GitHub picks
          # /releases/latest by `created_at`, and in THIS repo every release has the
          # same one — atlarix-releases is a release host with a single commit
          # (2026-07-26T19:32:39Z), so every tag points at it and every release ties
          # exactly. v14.33.0 published fine, with all 12 assets, and "Latest" stayed
          # on v14.32.0: the launchpad, the /releases/latest redirect and the
          # auto-updater all still served the previous version. Publishing is
          # therefore NOT the last thing that has to be true — being latest is.
          API="https://api.github.com/repos/AmariahAK/atlarix-releases/releases/${RELEASE_ID}"
          published=""
          for attempt in 1 2 3 4 5; do
            if body=$(curl -sS --fail-with-body -X PATCH \
                -H "Authorization: token $RELEASES_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d '{"draft":false,"make_latest":"true"}' "$API"); then
              published=$(printf '%s' "$body" | grep -o '"draft"[[:space:]]*:[[:space:]]*false' || true)
              if [ -n "$published" ]; then
                echo "Published on attempt ${attempt}."
                break
              fi
              echo "::warning::PATCH succeeded but the release still reads as a draft (attempt ${attempt})."
            else
              echo "::warning::PATCH failed (attempt ${attempt}/5): ${body}"
            fi
            sleep $((attempt * 10))
          done

          # Read it back independently. A release that is still a draft after this
          # is invisible to users, which is the whole point of the job.
          final=$(curl -sS --fail-with-body \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API" || true)
          # A here-string, not `printf | grep -q`: grep -q exits on the first
          # match, and once the body outgrows the pipe buffer (v15.0.0, 25 assets)
          # printf dies of SIGPIPE and pipefail turns a published release into
          # "STILL A DRAFT".
          if grep -q '"draft"[[:space:]]*:[[:space:]]*false' <<<"$final"; then
            echo "Confirmed: release ${RELEASE_ID} is published."
          else
            echo "::error::Release ${RELEASE_ID} is STILL A DRAFT after 5 attempts — the assets are attached but nobody can see it. Publish by hand: gh api -X PATCH repos/AmariahAK/atlarix-releases/releases/${RELEASE_ID} -f draft=false"
            exit 1
          fi

          # Second read-back, against a DIFFERENT endpoint: does /releases/latest
          # actually resolve to this release? The one above only proves the release
          # is visible; this proves it is the one everything downstream fetches.
          latest_id=$(curl -sS --fail-with-body \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/AmariahAK/atlarix-releases/releases/latest" \
            | tr ',' '\n' | grep -m1 '"id"' | tr -dc '0-9' || true)
          if [ "$latest_id" = "$RELEASE_ID" ]; then
            echo "Confirmed: /releases/latest resolves to ${RELEASE_ID}."
          else
            echo "::error::Release ${RELEASE_ID} is published but /releases/latest still resolves to ${latest_id:-<unknown>} — the launchpad and the auto-updater will keep serving the OLD version. Fix by hand: gh api -X PATCH repos/AmariahAK/atlarix-releases/releases/${RELEASE_ID} -f make_latest=true"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # After the release is public: the CLI's npm platform packages, the Homebrew
  # tap and winget. Each is independent and none can block the desktop release.
  # ───────────────────────────────────────────────────────────────────────────
  publish-cli-npm:
    needs: [publish-release, cli-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), as headless.yml
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships an npm that does trusted publishing (>= 11.5.1). This
      # used to be Node 25 plus `npm install -g npm@latest`, which broke the
      # day npm 12 dropped Node 25 (EBADENGINE, 15.0.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: atlarix-cli-*
          path: cli
      - name: Stage atlarix-<platform> packages
        run: |
          mkdir -p bins
          for d in cli/atlarix-cli-*; do
            t="${d#cli/}"; mkdir -p "bins/$t"
            cp "$d"/cli/atlarix* "bins/$t/"   # artifact layout: cli/…, assets/… (no out/)
          done
          node scripts/build-cli-npm.mjs bins npm-cli
      - name: Publish
        # Trusted publishing (OIDC): no token. Every atlarix-<platform> package
        # trusts this workflow (release.yml), so nothing here needs the owner.
        # A NEW platform is the one exception: npm only lets a package trust a
        # workflow once it exists, so its first version is published by hand
        # (`npm publish --auth-type=web` in its staged folder) and trusted with
        # `npm trust github <name> --repo AmariahAK/Atlarix --file release.yml`.
        # No provenance (see headless.yml's Publish step): trusted publishing adds
        # it on its own while the repo is public, and it rejects our repository.url.
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          for p in npm-cli/*/; do
            name=$(node -p "require('./$p/package.json').name")
            version=$(node -p "require('./$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"; continue
            fi
            (cd "$p" && npm publish --access public)
          done

  # Re-publish the npm platform packages of an ALREADY published release, from
  # its own CLI archives: `gh workflow run release.yml -f version=vX.Y.Z -f npm_only=true`.
  # For when publish-cli-npm failed after the release went out (15.0.1). It
  # lives in this file because each atlarix-<platform> package trusts
  # release.yml, and npm checks the workflow file, not the ref.
  republish-cli-npm:
    if: github.event_name == 'workflow_dispatch' && inputs.npm_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The CLI binaries from the published release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || { echo "::error::version is required (e.g. v15.0.1)"; exit 1; }
          want="${VERSION#v}"
          have="$(node -p "require('./package.json').version")"
          [ "$want" = "$have" ] || { echo "::error::package.json is $have, not $want: run this from the release's commit"; exit 1; }
          mkdir -p dl bins
          gh release download "$VERSION" -R AmariahAK/atlarix-releases -D dl -p 'atlarix-cli-*.tar.gz' -p 'atlarix-cli-windows-*.zip'
          for f in dl/atlarix-cli-*.tar.gz; do t="$(basename "$f" .tar.gz)"; mkdir -p "bins/$t"; tar xzf "$f" -C "bins/$t"; done
          for f in dl/atlarix-cli-windows-*.zip; do t="$(basename "$f" .zip)"; mkdir -p "bins/$t"; unzip -q "$f" -d "bins/$t"; done
          node scripts/build-cli-npm.mjs bins npm-cli
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          for p in npm-cli/*/; do
            name=$(node -p "require('./$p/package.json').name")
            version=$(node -p "require('./$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"; continue
            fi
            (cd "$p" && npm publish --access public)
          done

  update-homebrew:
    needs: [publish-release, cli-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-meta
      - name: Push Formula/atlarix.rb to AmariahAK/homebrew-atlarix
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the Homebrew tap was not updated."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/AmariahAK/homebrew-atlarix.git" tap
          mkdir -p tap/Formula && cp atlarix.rb tap/Formula/atlarix.rb
          cd tap
          git config user.name "atlarix-release"
          git config user.email "amariah.abish@gmail.com"
          git add Formula/atlarix.rb
          git commit -m "atlarix ${GITHUB_REF_NAME#v}" || { echo "formula unchanged"; exit 0; }
          git push

  update-winget:
    needs: [publish-release, cli-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Submit the new version to winget-pkgs (komac)
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::warning::WINGET_TOKEN is not set: no winget submission."
            exit 0
          }
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $url = "https://github.com/AmariahAK/atlarix-releases/releases/download/v$version/atlarix-cli-windows-x64.zip"
          winget install --id RussellBanks.Komac --exact --silent --accept-source-agreements --accept-package-agreements
          komac update AmariahAK.AtlarixCLI --version $version --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::komac update failed for $version."; exit 1 }

  announce-release:
    needs:
      [
        quality,
        create-draft,
        build-macos,
        build-linux,
        build-windows,
        publish-release,
      ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog
        run: |
          chmod +x scripts/ci/extract-changelog.sh
          VERSION="${GITHUB_REF_NAME#v}"
          # The GitHub release carries the WHOLE section. 80 was an arbitrary cap
          # that this release's notes (92 lines) crossed, and the failure mode is
          # the silent kind: the last paragraphs simply vanish from the published
          # notes with nothing to say they were dropped. The section boundary in
          # docs/CHANGELOG.md is the real limit; this is only a runaway guard.
          ./scripts/ci/extract-changelog.sh "$VERSION" 400 > release-notes.md || true
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::warning::No section found in docs/CHANGELOG.md for v${VERSION}. Expected ## [${VERSION}] or ## v${VERSION}."
            echo "See full changelog: https://github.com/AmariahAK/atlarix-releases/releases/tag/v${VERSION}" > release-notes.md
          fi

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          # RETRY, don't fall through to `create`.
          #
          # v14.32.0 shipped with the fallback "See CHANGELOG.md" body because
          # this raced: `publish-release` had published 11s earlier, `gh release
          # edit` still answered "release not found", so the old `if ! edit; then
          # create; fi` took the create path and died on
          # `HTTP 422: Release.tag_name already exists`.
          #
          # Creating can never be right when publish-release is a `needs`
          # dependency — a release always exists by now, so a failed edit means
          # the lookup has not caught up, not that anything is missing. The whole
          # failure was silent where it mattered: the release itself was fine and
          # complete, only its NOTES were the placeholder, which nothing checks.
          for attempt in 1 2 3 4 5; do
            if gh release edit "${GITHUB_REF_NAME}" \
              --repo AmariahAK/atlarix-releases \
              --notes-file release-notes.md; then
              echo "Release notes updated on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::gh release edit failed (attempt ${attempt}/5) — retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          # Only now consider that the release genuinely does not exist.
          if gh release view "${GITHUB_REF_NAME}" --repo AmariahAK/atlarix-releases >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} EXISTS but its notes could not be updated. The published release is carrying the placeholder body — fix by hand with: gh release edit ${GITHUB_REF_NAME} --repo AmariahAK/atlarix-releases --notes-file release-notes.md"
            exit 1
          fi
          echo "::warning::Release ${GITHUB_REF_NAME} not found after retries — creating it."
          gh release create "${GITHUB_REF_NAME}" \
            --repo AmariahAK/atlarix-releases \
            --notes-file release-notes.md \
            --title "Atlarix ${GITHUB_REF_NAME}"

      - name: Post Discord announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/ci/announce-discord.sh "$GITHUB_REF_NAME"

