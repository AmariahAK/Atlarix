# Quality checks on main/PR; full release build on version tags (v*).
# Credentials are read from GitHub repository secrets and embedded at build time via Vite define.
# See README "Deployment (CI / GitHub Actions)" for the list of required secrets.

name: Atlarix CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false

# Retagging the same version cancels in-progress runs by default; that often aborts
# build-windows during setup-node npm cache restore (no error line, step shows failure).
concurrency:
  group: atlarix-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

# Env block for jobs that run npm run make (build-macos, build-linux). No Google/GitHub OAuth — Supabase handles auth.
# Only values the CLIENT BUILD embeds belong here — this block is the environment
# of `npm run make`, so anything listed is readable by every build script and
# dependency postinstall that runs during packaging.
#
# REMOVED (v14.18.0) because the build never read them, yet they were exposed to
# it on every release: LEMONSQUEEZY_API_KEY, LEMONSQUEEZY_WEBHOOK_SECRET,
# RESEND_API_KEY. All three are server-side only and live where they are used —
# the Supabase edge functions (create-checkout, cancel-subscription, the webhook
# verifier, send-email). `vite.main.config.mts` has always excluded them from the
# embed allowlist; this closes the remaining exposure.
env:
  LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
  LEMONSQUEEZY_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_VARIANT_ID }}
  LEMONSQUEEZY_CREDIT_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_CREDIT_VARIANT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  # Atlarix Core routes through atlarix-proxy — the client embeds only the PUBLIC
  # proxy URL (never a provider key; those live on the proxy). This must be in the
  # build env or a release ships with no Core endpoint.
  #
  # NOT SECRETS. The Core model ids are published in the public
  # `atlarix-releases/core-models.json` and read live by every installed client,
  # and the proxy URL is in every packaged app. They stayed GitHub secrets out of
  # caution, which cost real debugging time: masking them makes CI logs unreadable
  # and breaks env-dependent tests that pass locally. `vars.` keeps them
  # configurable without pretending they are confidential; the `secrets.` fallback
  # lets this work before the repository variables are created.
  ATLARIX_CORE_PROXY_URL: ${{ vars.ATLARIX_CORE_PROXY_URL || secrets.ATLARIX_CORE_PROXY_URL }}
  ATLARIX_CORE_MODEL_1: ${{ vars.ATLARIX_CORE_MODEL_1 || secrets.ATLARIX_CORE_MODEL_1 }}
  ATLARIX_CORE_MODEL_2: ${{ vars.ATLARIX_CORE_MODEL_2 || secrets.ATLARIX_CORE_MODEL_2 }}
  ATLARIX_CORE_MODEL_3: ${{ vars.ATLARIX_CORE_MODEL_3 || secrets.ATLARIX_CORE_MODEL_3 }}
  ATLARIX_CORE_MODEL_4: ${{ vars.ATLARIX_CORE_MODEL_4 || secrets.ATLARIX_CORE_MODEL_4 }}
  OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
  # Opt in to Node 24 action runtime now rather than waiting for the forced migration (June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Stable path for Electron zips so actions/cache can persist them across runs (reduces postinstall 504s).
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  # Public npm only — lockfile must not contain CodeArtifact resolved URLs (see scripts/verify-npm-lock-registry.mjs).
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The grep/glob tools shell out to ripgrep; the runner image no longer
      # ships it, so tests that exercise them (glob-secret-denylist) need it here.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Node 20 went EOL in April 2026, and `engines.node` is ">=24". The build
      # jobs below already run 24/25; this one lagged because it only type-checks
      # and tests. Kept at 24 rather than 25: `build-windows` and `msix` pin 24
      # because Node 25 breaks better-sqlite3's `llvm-lib /LTCG:INCREMENTAL` on
      # windows-latest, so 24 is the version every job can agree on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall builds electron; not needed for type/lint/tests
      - name: Install dependencies
        run: node scripts/verify-npm-lock-registry.mjs && npm ci --ignore-scripts && npx patch-package

      # --ignore-scripts skips better-sqlite3's native build. The node vitest
      # project's migration/schema tests (e.g. automations-schema.test.ts) need a
      # real Node-ABI binding, so rebuild just that one prebuilt binary (fast,
      # prebuild-install fetches a matching .node — no source compile). The
      # agent-evals project stays a local gate and self-skips here regardless.
      - name: Rebuild native better-sqlite3 (Node ABI)
        run: npm rebuild better-sqlite3

      - name: Type check (tsc)
        run: npm run check:ts

      - name: Lint (oxlint)
        run: npm run check:lint

      # The Rust sandbox helpers are `#![cfg(windows)]` / `#![cfg(target_os =
      # "linux")]`, so a plain `cargo build` on the wrong host compiles an EMPTY
      # binary and reports success — which is how the Windows AppContainer helper
      # shipped broken. `cargo check --target <triple>` sets the cfg for real and
      # type-checks the body; it needs no cross-linker because it never links.
      # Behaviour is still the `sandbox` self-test probe's job in the package jobs.
      - name: Install Rust targets for sandbox helpers
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add x86_64-unknown-linux-gnu

      - name: Type check sandbox helpers (cross-target)
        run: npm run check:sandbox

      # NOTE: the agent-evals vitest project is a LOCAL gate — its harness needs
      # a Node-ABI better-sqlite3 (tests/infra) plus a git-mock server and the
      # fake-LLM server that aren't provisioned on CI runners. It self-skips when
      # tests/infra's native binary is absent (see vitest.config.ts), so CI runs
      # the node + renderer projects here; run `npm test` locally for the evals.
      - name: Tests (vitest)
        run: npm test

      # Report-only until the knip config is verified clean enough to block on.
      - name: Dead code report (knip)
        run: npx knip --no-progress || true

  create-draft:
    needs: quality
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Set tag name
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version || 'v0.0.0-manual' }}" >> $GITHUB_OUTPUT
          fi

      # Checkout so the REAL changelog can go into the body at creation time.
      # `announce-release` used to edit the notes in afterwards, which needs a
      # READ — and RELEASES_TOKEN cannot read releases, so v14.32.0 shipped with
      # the "See CHANGELOG.md" placeholder. Writing the body here needs no
      # lookup at all.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release body
        id: body
        run: |
          set -uo pipefail
          TAG="${{ steps.set_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          {
            echo "## Atlarix ${TAG}"
            echo ""
            echo "### Downloads"
            echo "- **macOS (Apple Silicon)**: \`Atlarix-*-arm64.dmg\`"
            echo "- **macOS (Intel)**: \`Atlarix-*-x64.dmg\`"
            echo "- **Windows**: \`Atlarix Setup *.exe\`"
            echo "- **Linux**: \`.deb\`, \`.rpm\`, or \`.AppImage\`"
            echo ""
            echo "### Installation Notes"
            echo "- **macOS**: Double-click to install — Apple Notarized, no security warnings."
            echo "- **Linux**: \`chmod +x Atlarix.AppImage && ./Atlarix.AppImage\`"
            echo ""
            echo "---"
            echo ""
          } > release-body.md
          chmod +x scripts/ci/extract-changelog.sh
          ./scripts/ci/extract-changelog.sh "$VERSION" 400 >> release-body.md || true
          # A missing section must be LOUD: the placeholder body is what shipped
          # last time and nobody noticed, because the release itself was fine.
          if [ "$(wc -c < release-body.md)" -lt 700 ]; then
            echo "::warning::No changelog section found for ${VERSION} — the release body is the bare download list. Expected '## [${VERSION}]' in docs/CHANGELOG.md."
          fi
          echo "--- release body ---"
          cat release-body.md

      - name: Create draft release
        id: create_release
        # PINNED to v2.6.2 — what `@v2` resolved to on 2026-08-17, and what this
        # step is known to work on. The floating major is not free: the identical
        # action in headless.yml started failing that day, and nothing on our
        # side had changed. This is the job that publishes releases; it should
        # not move on its own.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: Atlarix ${{ steps.set_tag.outputs.tag }}
          body_path: release-body.md
          draft: true
          prerelease: false
          generate_release_notes: true
          repository: AmariahAK/atlarix-releases
          token: ${{ secrets.RELEASES_TOKEN }}

  build-macos:
    needs: [quality, create-draft]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      matrix:
        arch: [arm64, x64]
      fail-fast: false
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        shell: bash
        run: |
          node scripts/verify-npm-lock-registry.mjs
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt of 5); removing node_modules and retrying..."
            rm -rf node_modules
            sleep $((attempt * 25))
          done
          echo "npm ci failed after 5 attempts"
          exit 1

      - name: Verify Forge patch applied
        run: node scripts/verify-forge-patch.mjs

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      # The packaged --self-test probes ripgrep (`rg`); the macos-latest (arm64)
      # runner doesn't ship it, so the arm64 self-test failed with `spawn rg ENOENT`.
      # Install it here, mirroring the Windows job's `choco install ripgrep`.
      - name: Install ripgrep
        run: brew install ripgrep

      - name: Tests
        run: npm test

      - name: Build for macOS (${{ matrix.arch }})
        run: |
          set -euo pipefail
          npm run clean
          npm run ci:package -- --arch=${{ matrix.arch }}
          node scripts/verify-ci-package-out.mjs --stage package --platform darwin --arch ${{ matrix.arch }}
          # Packaged smoke: launch the real binary --self-test (pty spawn, worker
          # resolution, rg) — catches packaged-only breakages the static
          # verifier can't. Only x64 CI runners can execute an arm64 bin natively,
          # so run the self-test only when the build arch matches the runner.
          if [ "${{ matrix.arch }}" = "$(node -p process.arch)" ]; then
            node scripts/run-packaged-self-test.mjs --arch=${{ matrix.arch }}
          else
            echo "::notice::skipping self-test — build arch ${{ matrix.arch }} != runner $(node -p process.arch)"
          fi
          # appdmg@0.6.6 intermittently fails `hdiutil detach /Volumes/Atlarix`
          # ("No such file or directory") when the DMG volume auto-ejects mid-make.
          # Detach any stale Atlarix volume and retry the installers (make) step.
          make_with_retry() {
            for attempt in 1 2 3; do
              for vol in /Volumes/Atlarix*; do
                [ -e "$vol" ] && hdiutil detach -force "$vol" >/dev/null 2>&1 || true
              done
              rm -rf out/make
              if npm run ci:installers -- --arch=${{ matrix.arch }}; then
                return 0
              fi
              echo "::warning::macOS make attempt ${attempt} failed (appdmg/hdiutil flake); retrying…"
              sleep 5
            done
            echo "::error::macOS make failed after 3 attempts"
            return 1
          }
          make_with_retry
          node scripts/verify-ci-package-out.mjs --stage make --platform darwin --arch ${{ matrix.arch }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Notarize macOS app (DMG), staple .app, re-zip stapled bundle, staple DMG
        run: |
          APP=$(find out -type d -name "Atlarix.app" -path "*/Atlarix-darwin-*" | head -1)
          DMG=$(find out/make -name "*.dmg" | head -1)
          ZIP=$(find out/make -name "*.zip" -path "*/zip/darwin/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No Atlarix.app found under out/"
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 90m
          echo "Stapling app bundle..."
          xcrun stapler staple "$APP"
          if [ -n "$ZIP" ]; then
            echo "Re-zipping stapled app to $ZIP ..."
            ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          else
            echo "::warning::No ZIP found under out/make; skipping re-zip."
          fi
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Done — $DMG is signed, notarized, and stapled."
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload macOS assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          find out/make -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

      - name: Generate and upload latest-mac.yml (electron-updater feed, arm64 only)
        if: success() && matrix.arch == 'arm64'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          VERSION=$(node -p "require('./package.json').version")
          ZIP=$(find out/make -name "*.zip" -path "*/zip/darwin/*" | head -1)
          DMG=$(find out/make -name "*.dmg" | head -1)
          if [ -z "$ZIP" ] || [ -z "$DMG" ]; then
            echo "Missing ZIP or DMG, skipping latest-mac.yml"
            exit 0
          fi
          ZIP_NAME=$(basename "$ZIP")
          ZIP_SIZE=$(stat -f%z "$ZIP")
          ZIP_SHA512=$(openssl dgst -sha512 -binary "$ZIP" | openssl base64 | tr -d '\n')
          DMG_NAME=$(basename "$DMG")
          DMG_SIZE=$(stat -f%z "$DMG")
          DMG_SHA512=$(openssl dgst -sha512 -binary "$DMG" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-mac.yml << YAML
          version: $VERSION
          files:
            - url: $ZIP_NAME
              sha512: $ZIP_SHA512
              size: $ZIP_SIZE
            - url: $DMG_NAME
              sha512: $DMG_SHA512
              size: $DMG_SIZE
          path: $ZIP_NAME
          sha512: $ZIP_SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          sed -i '' 's/^          //' latest-mac.yml
          echo "--- latest-mac.yml ---"
          cat latest-mac.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-mac.yml \
            "$UPLOAD_URL?name=latest-mac.yml"

  build-linux:
    needs: [quality, create-draft]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # keytar (native module) needs libsecret headers/pkg-config on Linux;
          # xvfb gives the packaged-smoke a virtual display (Electron whenReady).
          sudo apt-get install -y dpkg fakeroot rpm libsecret-1-dev xvfb ripgrep

      - name: Install appimagetool (required by @reforged/maker-appimage)
        run: |
          wget -q -O /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          # Extract in-place — FUSE is not available in GitHub runners
          /tmp/appimagetool.AppImage --appimage-extract-and-run --help > /dev/null 2>&1 || true
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract > /dev/null 2>&1
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Install dependencies
        run: |
          node scripts/verify-npm-lock-registry.mjs
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt of 5); removing node_modules and retrying..."
            rm -rf node_modules
            sleep $((attempt * 25))
          done
          echo "npm ci failed after 5 attempts"
          exit 1

      - name: Verify Forge patch applied
        run: node scripts/verify-forge-patch.mjs

      - name: Tests
        run: npm test

      - name: Build Linux sandbox helper (Rust)
        run: |
          # FAIL-LOUD: a non-compiling helper ships Linux UNSANDBOXED (silent
          # security regression). Fail the release unless ALLOW_UNSANDBOXED_RELEASE
          # is explicitly set (emergency escape hatch). Fix the crate + re-run.
          BIN="native/atlarix-sandbox-linux/target/release/atlarix-sandbox-linux"
          if cargo build --release --manifest-path native/atlarix-sandbox-linux/Cargo.toml && [ -f "$BIN" ]; then
            echo "Built $BIN (unsigned — Linux needs no code-signing)."
          elif [ "${ALLOW_UNSANDBOXED_RELEASE:-}" = "1" ]; then
            echo "::warning::atlarix-sandbox-linux failed to build, but ALLOW_UNSANDBOXED_RELEASE=1 — shipping WITHOUT the Landlock sandbox (falls back to bwrap / unsandboxed)."
          else
            echo "::error::atlarix-sandbox-linux failed to build — refusing to ship Linux unsandboxed. Fix the crate, or set ALLOW_UNSANDBOXED_RELEASE=1 to override."
            exit 1
          fi
        env:
          ALLOW_UNSANDBOXED_RELEASE: ${{ vars.ALLOW_UNSANDBOXED_RELEASE }}

      - name: Upload Landlock helper for Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: landlock-helper
          path: native/atlarix-sandbox-linux/target/release/atlarix-sandbox-linux
          if-no-files-found: warn
          retention-days: 1

      - name: Build for Linux
        run: |
          set -euo pipefail
          npm run clean
          npm run ci:package
          node scripts/verify-ci-package-out.mjs --stage package --platform linux --arch x64
          npm run ci:installers
          node scripts/verify-ci-package-out.mjs --stage make --platform linux --arch x64
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Linux assets to release
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          shopt -s nullglob
          mapfile -t assets < <(find out/make -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \))
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Linux installers under out/make"
            exit 1
          fi
          find out/make -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$(basename "$f")"
          done

      - name: Generate and upload latest-linux.yml (electron-updater feed)
        if: success()
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          APPIMAGE=$(find out/make -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping latest-linux.yml"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          FILENAME=$(basename "$APPIMAGE")
          SIZE=$(stat -c%s "$APPIMAGE")
          SHA512=$(openssl dgst -sha512 -binary "$APPIMAGE" | openssl base64 | tr -d '\n')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-linux.yml << YAML
          version: $VERSION
          files:
            - url: $FILENAME
              sha512: $SHA512
              size: $SIZE
          path: $FILENAME
          sha512: $SHA512
          releaseDate: '$RELEASE_DATE'
          YAML
          # Strip leading spaces (heredoc indentation)
          sed -i 's/^          //' latest-linux.yml
          echo "--- latest-linux.yml ---"
          cat latest-linux.yml
          curl -sS -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-linux.yml \
            "$UPLOAD_URL?name=latest-linux.yml"

  build-windows:
    needs: [quality, create-draft, build-linux]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 25 breaks better-sqlite3 native build on windows-latest (llvm-lib /LTCG:INCREMENTAL).
          node-version: "24"
          # npm cache restore on windows-latest is flaky (tar on C:\npm\cache; fails when a prior run saved cache).

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - name: Install dependencies
        shell: pwsh
        run: |
          node scripts/verify-npm-lock-registry.mjs
          $attempts = 0
          $maxAttempts = 5
          while ($attempts -lt $maxAttempts) {
            $attempts++
            npm ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci succeeded on attempt $attempts"
              exit 0
            }
            Write-Warning "npm ci failed (attempt $attempts of $maxAttempts); retrying..."
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($attempts * 25)
          }
          Write-Error "npm ci failed after $maxAttempts attempts"
          exit 1

      - name: Verify Forge patch applied
        shell: pwsh
        run: node scripts/verify-forge-patch.mjs

      - name: Ensure Electron binary (Windows)
        shell: pwsh
        run: node node_modules/electron/install.js
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

      - name: Verify Electron distro zip (Windows)
        shell: pwsh
        run: node scripts/win-ci-electron-zip.mjs --verify
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          $rg = Get-Command rg -ErrorAction SilentlyContinue
          if (-not $rg) {
            Write-Error "rg not on PATH after choco install"
            exit 1
          }
          Write-Host "ripgrep: $($rg.Source)"
          rg --version

      - name: Test and blueprint index benchmarks
        shell: pwsh
        run: |
          # The combined `npm test` has known Windows-only worker/libuv flakes
          # (e.g. a libuv fs-event assertion crashing a tinypool worker →
          # ERR_IPC_CHANNEL_CLOSED). Per-project runs are green; retry the combined
          # run once so a transient worker crash doesn't fail the release build.
          npm test
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::npm test failed (attempt 1) — retrying once (known Windows worker/libuv flake)."
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare packager temp (Windows)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "electron-packager"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.cache/packager-tmp" | Out-Null

      - name: Download Landlock helper for WSL confinement
        uses: actions/download-artifact@v4
        with:
          name: landlock-helper
          path: native/atlarix-sandbox-linux/target/release/
        continue-on-error: true

      - name: Build for Windows (Vite)
        shell: pwsh
        run: |
          npm run clean
          node scripts/win-ci-vite.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Build Windows sandbox helper (Rust)
        shell: pwsh
        env:
          ALLOW_UNSANDBOXED_RELEASE: ${{ vars.ALLOW_UNSANDBOXED_RELEASE }}
        run: |
          # FAIL-LOUD: a non-compiling helper ships Windows UNSANDBOXED (silent
          # security regression). Fail the release unless ALLOW_UNSANDBOXED_RELEASE
          # is set (emergency escape hatch). Signing stays optional — an unsigned
          # helper works identically for sandboxing; the cert only affects SmartScreen.
          cargo build --release --manifest-path native/atlarix-sandbox/Cargo.toml
          $exe = "native/atlarix-sandbox/target/release/atlarix-sandbox.exe"
          if (Test-Path $exe) {
            if ($env:SM_CODE_SIGNING_CERT_SHA1_HASH) {
              & signtool sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 $exe
              if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for sandbox helper"; exit $LASTEXITCODE }
            } else {
              Write-Host "No SM_CODE_SIGNING_CERT_SHA1_HASH — shipping atlarix-sandbox.exe unsigned (sandbox works identically)."
            }
            Write-Host "Built sandbox helper: $exe"
          } elseif ($env:ALLOW_UNSANDBOXED_RELEASE -eq "1") {
            Write-Host "::warning::atlarix-sandbox.exe failed to build, but ALLOW_UNSANDBOXED_RELEASE=1 — shipping WITHOUT the Windows sandbox (run_command stays unsandboxed)."
          } else {
            Write-Host "::error::atlarix-sandbox.exe failed to build — refusing to ship Windows unsandboxed. Fix the crate, or set ALLOW_UNSANDBOXED_RELEASE=1 to override."
            exit 1
          }

      - name: Build for Windows (package + installers)
        timeout-minutes: 55
        shell: pwsh
        run: |
          node scripts/win-ci-package.mjs
          if (-not $?) { exit $LASTEXITCODE }
          node scripts/verify-ci-package-out.mjs --stage package --platform win32 --arch x64
          if (-not $?) { exit $LASTEXITCODE }
          # Packaged smoke: launch atlarix.exe --self-test (pty spawn via conpty,
          # worker resolution, rg).
          node scripts/run-packaged-self-test.mjs --arch=x64
          if (-not $?) { exit $LASTEXITCODE }
          node scripts/verify-ci-package-out.mjs --stage make --platform win32 --arch x64
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          TMP: ${{ github.workspace }}/.cache/packager-tmp
          TEMP: ${{ github.workspace }}/.cache/packager-tmp

      - name: Upload Windows assets to release
        if: success()
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ needs.create-draft.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"
          export UPLOAD_URL RELEASES_TOKEN
          shopt -s nullglob
          # Include the Squirrel `RELEASES` index (no extension): update.electronjs.org
          # reads it + the *-full.nupkg to serve the Windows auto-update feed. Without
          # it the built-in autoUpdater has nothing to download.
          mapfile -t assets < <(find out/make -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \))
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Windows installers under out/make"
            exit 1
          fi
          find out/make -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \) -print0 | while IFS= read -r -d '' f; do
            BASENAME=$(basename "$f")
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BASENAME")
            echo "Uploading $BASENAME..."
            curl -sS -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$ENCODED"
          done

      # NOTE: no latest.yml is generated for Windows. electron-updater's NSIS feed
      # (latest.yml) does NOT match our Squirrel.Windows installers, and the old
      # step also produced a broken url (space vs dot in the asset name). Windows
      # now updates via update-electron-app / update.electronjs.org, which reads
      # the RELEASES index + *-full.nupkg uploaded above — no latest.yml needed.

  # Microsoft Store package. Produces the .msix + .msixupload as a WORKFLOW ARTIFACT
  # for manual submission to Partner Center — deliberately NOT uploaded to
  # atlarix-releases, because the package is unsigned and an unsigned .msix cannot be
  # installed without the signer's certificate. Publishing one would put a broken
  # download on the public releases page.
  #
  # DELIBERATELY ABSENT from `publish-release`'s and `announce-release`'s `needs`: the
  # Store package is not part of the public release, so an MSIX failure must never
  # block shipping the .exe/.dmg/.deb. It gates on `quality` only.
  #
  # Was workflow_dispatch-only until the packaged-context spike passed on real
  # Windows hardware (8/8 probes inside the MSIX, sandbox assertions included).
  build-msix:
    needs: [quality]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/msix.yml
    with:
      arch: x64
      # A release build is exactly when the Store wrapper is wanted.
      upload_wrapper: true
    # Called workflows do NOT inherit the caller's `env`, and msix.yml needs the
    # same build-time credentials (Supabase, Lemon Squeezy, Core proxy) that the
    # other build jobs get from the top-level env block.
    secrets: inherit

  publish-release:
    needs: [quality, create-draft, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish draft release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
        run: |
          set -uo pipefail
          # THIS STEP COULD NOT FAIL, AND THAT IS HOW v14.33.0 SHIPPED AS A DRAFT.
          #
          # It was a bare `curl -sS`, which exits 0 on an HTTP error — so a 503
          # from GitHub returned "No server is currently available", the step went
          # green, every other job went green, and the release sat unpublished
          # with all 12 assets attached and nobody able to see it. Nothing else in
          # the pipeline checks, because publishing IS the last thing.
          #
          # So: fail on HTTP error, retry the transient ones, and then CONFIRM the
          # release actually reads back as published rather than trusting the PATCH.
          #
          # `make_latest` is NOT cosmetic and NOT implied by publishing. GitHub picks
          # /releases/latest by `created_at`, and in THIS repo every release has the
          # same one — atlarix-releases is a release host with a single commit
          # (2026-07-26T19:32:39Z), so every tag points at it and every release ties
          # exactly. v14.33.0 published fine, with all 12 assets, and "Latest" stayed
          # on v14.32.0: the launchpad, the /releases/latest redirect and the
          # auto-updater all still served the previous version. Publishing is
          # therefore NOT the last thing that has to be true — being latest is.
          API="https://api.github.com/repos/AmariahAK/atlarix-releases/releases/${RELEASE_ID}"
          published=""
          for attempt in 1 2 3 4 5; do
            if body=$(curl -sS --fail-with-body -X PATCH \
                -H "Authorization: token $RELEASES_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d '{"draft":false,"make_latest":"true"}' "$API"); then
              published=$(printf '%s' "$body" | grep -o '"draft"[[:space:]]*:[[:space:]]*false' || true)
              if [ -n "$published" ]; then
                echo "Published on attempt ${attempt}."
                break
              fi
              echo "::warning::PATCH succeeded but the release still reads as a draft (attempt ${attempt})."
            else
              echo "::warning::PATCH failed (attempt ${attempt}/5): ${body}"
            fi
            sleep $((attempt * 10))
          done

          # Read it back independently. A release that is still a draft after this
          # is invisible to users, which is the whole point of the job.
          final=$(curl -sS --fail-with-body \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API" || true)
          if printf '%s' "$final" | grep -q '"draft"[[:space:]]*:[[:space:]]*false'; then
            echo "Confirmed: release ${RELEASE_ID} is published."
          else
            echo "::error::Release ${RELEASE_ID} is STILL A DRAFT after 5 attempts — the assets are attached but nobody can see it. Publish by hand: gh api -X PATCH repos/AmariahAK/atlarix-releases/releases/${RELEASE_ID} -f draft=false"
            exit 1
          fi

          # Second read-back, against a DIFFERENT endpoint: does /releases/latest
          # actually resolve to this release? The one above only proves the release
          # is visible; this proves it is the one everything downstream fetches.
          latest_id=$(curl -sS --fail-with-body \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/AmariahAK/atlarix-releases/releases/latest" \
            | tr ',' '\n' | grep -m1 '"id"' | tr -dc '0-9' || true)
          if [ "$latest_id" = "$RELEASE_ID" ]; then
            echo "Confirmed: /releases/latest resolves to ${RELEASE_ID}."
          else
            echo "::error::Release ${RELEASE_ID} is published but /releases/latest still resolves to ${latest_id:-<unknown>} — the launchpad and the auto-updater will keep serving the OLD version. Fix by hand: gh api -X PATCH repos/AmariahAK/atlarix-releases/releases/${RELEASE_ID} -f make_latest=true"
            exit 1
          fi

  announce-release:
    needs: [quality, create-draft, build-macos, build-linux, build-windows, publish-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog
        run: |
          chmod +x scripts/ci/extract-changelog.sh
          VERSION="${GITHUB_REF_NAME#v}"
          # The GitHub release carries the WHOLE section. 80 was an arbitrary cap
          # that this release's notes (92 lines) crossed, and the failure mode is
          # the silent kind: the last paragraphs simply vanish from the published
          # notes with nothing to say they were dropped. The section boundary in
          # docs/CHANGELOG.md is the real limit; this is only a runaway guard.
          ./scripts/ci/extract-changelog.sh "$VERSION" 400 > release-notes.md || true
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::warning::No section found in docs/CHANGELOG.md for v${VERSION}. Expected ## [${VERSION}] or ## v${VERSION}."
            echo "See full changelog: https://github.com/AmariahAK/atlarix-releases/releases/tag/v${VERSION}" > release-notes.md
          fi
          {
            echo "Release notes (technical):"
            echo ""
            ./scripts/ci/extract-changelog.sh "$VERSION" 40 || true
          } > discord-body.txt
          # Discord stays a 40-line teaser deliberately — but a teaser that stops
          # mid-sentence with no way to read the rest is just a truncated post.
          # The link goes on every time, not only when the extract came back empty.
          echo "" >> discord-body.txt
          echo "Full notes: https://github.com/AmariahAK/atlarix-releases/releases/tag/${GITHUB_REF_NAME}" >> discord-body.txt

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          # RETRY, don't fall through to `create`.
          #
          # v14.32.0 shipped with the fallback "See CHANGELOG.md" body because
          # this raced: `publish-release` had published 11s earlier, `gh release
          # edit` still answered "release not found", so the old `if ! edit; then
          # create; fi` took the create path and died on
          # `HTTP 422: Release.tag_name already exists`.
          #
          # Creating can never be right when publish-release is a `needs`
          # dependency — a release always exists by now, so a failed edit means
          # the lookup has not caught up, not that anything is missing. The whole
          # failure was silent where it mattered: the release itself was fine and
          # complete, only its NOTES were the placeholder, which nothing checks.
          for attempt in 1 2 3 4 5; do
            if gh release edit "${GITHUB_REF_NAME}" \
              --repo AmariahAK/atlarix-releases \
              --notes-file release-notes.md; then
              echo "Release notes updated on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::gh release edit failed (attempt ${attempt}/5) — retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          # Only now consider that the release genuinely does not exist.
          if gh release view "${GITHUB_REF_NAME}" --repo AmariahAK/atlarix-releases >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} EXISTS but its notes could not be updated. The published release is carrying the placeholder body — fix by hand with: gh release edit ${GITHUB_REF_NAME} --repo AmariahAK/atlarix-releases --notes-file release-notes.md"
            exit 1
          fi
          echo "::warning::Release ${GITHUB_REF_NAME} not found after retries — creating it."
          gh release create "${GITHUB_REF_NAME}" \
            --repo AmariahAK/atlarix-releases \
            --notes-file release-notes.md \
            --title "Atlarix ${GITHUB_REF_NAME}"

      - name: Post Discord announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notification."
            exit 0
          fi
          export GITHUB_REF_NAME
          python3 <<'PY'
          import json, os
          from pathlib import Path
          ref = os.environ["GITHUB_REF_NAME"]
          version = ref.lstrip("v")
          desc = Path("discord-body.txt").read_text(encoding="utf-8")[:3800]
          if not desc.strip():
              desc = f"See https://github.com/AmariahAK/atlarix-releases/releases/tag/{ref}"
          payload = {
              # Forum channels require thread_name (or thread_id) on webhook posts.
              "thread_name": f"Atlarix v{version} released"[:100],
              "embeds": [{
                  "title": f"Atlarix v{version} released",
                  "description": desc,
                  "url": f"https://github.com/AmariahAK/atlarix-releases/releases/tag/{ref}",
              }]
          }
          Path("payload.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          PY
          curl -fsS -X POST -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK_URL"

