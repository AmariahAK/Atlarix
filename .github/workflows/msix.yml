# Build an UNSIGNED Windows MSIX for the Microsoft Store.
#
# Runs two ways: manually (workflow_dispatch) for testing a change, and called by
# release.yml on a `v*` tag so every release produces a submittable package.
#
# Still a SEPARATE workflow rather than a step on build-windows, because a
# workflow_dispatch against release.yml runs `create-draft`, which publishes a
# `v0.0.0-manual` draft release into the PUBLIC atlarix-releases repo — a test build
# must never touch the release channel.
#
# It was `workflow_dispatch`-only until the packaged-context spike passed on real
# Windows hardware (8/8 self-test probes inside the MSIX, including the sandbox
# assertions).
#
# THIS JOB IS ON THE CRITICAL PATH, as of 2026-08-28: `release.yml` lists it in
# `publish-release`'s `needs`, so a failure here blocks the desktop publish too.
# That is the owner's rule and the correct direction — the MSIX ships on every
# release and was never described as optional, and v14.38.3 is what treating it as
# optional cost (Store users, the majority, got nothing while the run went green).
# The trade it accepts is that a Store or Azure outage now blocks the desktop
# publish; the recovery is a job re-run, not a new tag.
#
# One safeguard remains: the artifact is NOT uploaded to atlarix-releases. It is
# unsigned, and an unsigned .msix is uninstallable without the signer's certificate
# — publishing one would just be a broken download on the public releases page.
#
# UNSIGNED is deliberate: signing happens on the maintainer's Windows machine, so no
# code-signing private key needs to live in GitHub secrets, and the certificate stays
# stable so `Add-AppxPackage` can upgrade in place between runs. Microsoft re-signs
# at certification anyway. See docs/MSIX_RUNBOOK.md.
#
# STORE SUBMISSION is automated via `scripts/store-submit.mjs` using the Partner
# Center Submission API v1. On release tags (workflow_call from release.yml), the
# script creates a new submission, uploads the .msixupload, and commits — triggering
# Microsoft certification automatically. A previous submission still pending is
# REPLACED, even mid-certification (owner, 2026-10-18: the newest release wins);
# only one Microsoft is mid-commit or mid-publish is waited for (up to 10 min), and
# if it is still there this release skips the Store with a warning. Manual runs
# (workflow_dispatch) skip this; `store_status` instead prints what the Store has,
# and `store_resubmit_run` re-runs a release's Store step (see that input).
# The submission step is `continue-on-error: true` so a Store API failure can never
# block anything. Requires three GitHub secrets: AZURE_AD_TENANT_ID,
# AZURE_AD_CLIENT_ID, AZURE_AD_CLIENT_SECRET.

name: Atlarix MSIX

on:
  # Manual runs, for testing a change without cutting a release.
  workflow_dispatch:
    inputs:
      # x64 is the ONLY valid option today: scripts/win-ci-lib.mjs hardcodes
      # `export const ARCH = "x64"`, so the packaged output directory is always
      # out/Atlarix-win32-x64. Adding arm64 here without changing that would
      # build x64 and then look for a directory that does not exist.
      arch:
        description: "Target architecture"
        required: false
        default: "x64"
        type: choice
        options:
          - x64
      upload_wrapper:
        description: "Also produce a .msixupload (ZIP wrapper) for Store submission"
        required: false
        default: false
        type: boolean
      # The runner label. `windows-latest` is windows-2025-vs2026 and is now the
      # DEFAULT: run 34461113885 went green end-to-end there on 2026-09-10, including
      # `Build MSIX`, with the node-gyp patch resolving VS 2026 to toolset v145.
      # `windows-2022` is kept as an option, not as a fallback — it is the way to
      # A/B a Windows failure against the old image before assuming the runner
      # changed something, and it is on a deprecation path either way.
      runner:
        description: "Runner image (windows-latest = the VS 2026 image)"
        required: false
        default: "windows-latest"
        type: choice
        options:
          - windows-2022
          - windows-latest
      # Read-only: print the pending and last published Store submissions (status,
      # details, certification notes) and build nothing.
      store_status:
        description: "Only report the Store's submissions (builds nothing)"
        required: false
        default: false
        type: boolean
      # Re-run a release's Store step without re-running the release (a job
      # re-run would also re-run publish-release and announce-release). Dispatch
      # on a branch made from the release tag, with the id of that tag's
      # release.yml run: its `landlock-helper` artifact (1-day retention) gives
      # the build WSL confinement, the strict sandbox check stays on, and the
      # package is submitted like a release's.
      store_resubmit_run:
        description: "Release run id: build this ref with that run's Landlock helper and submit it to the Store"
        required: false
        default: ""
        type: string
  # Called by release.yml on a `v*` tag, so every release produces a submittable
  # package without anyone remembering to run this by hand. `upload_wrapper`
  # defaults to TRUE there: a release build is exactly when the Store wrapper is
  # wanted. Inputs must be declared separately — workflow_call and
  # workflow_dispatch do not share an input block.
  workflow_call:
    inputs:
      arch:
        required: false
        default: "x64"
        type: string
      upload_wrapper:
        required: false
        default: true
        type: boolean
      # Declared separately because workflow_call and workflow_dispatch do not share
      # an input block. Releases now get windows-latest too — the dispatch that
      # gated this went green (34461113885).
      runner:
        required: false
        default: "windows-latest"
        type: string

# Mirrors the env block in release.yml. These are the credentials Vite embeds at
# BUILD time — Supabase, Lemon Squeezy variant ids, the Atlarix Core proxy URL.
# WITHOUT THEM the package installs and launches but has no auth and no checkout
# config, which makes the whole behavior spike meaningless: sign-in and the
# `atlarix://pro-return` leg are two of the four things it exists to verify.
env:
  LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
  LEMONSQUEEZY_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_VARIANT_ID }}
  LEMONSQUEEZY_CREDIT_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_CREDIT_VARIANT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  # As release.yml: only an explicit release build embeds the DSN (0t).
  ATLARIX_RELEASE: "1"
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  ATLARIX_CORE_PROXY_URL: ${{ vars.ATLARIX_CORE_PROXY_URL || secrets.ATLARIX_CORE_PROXY_URL }}
  ATLARIX_CORE_MODEL_1: ${{ vars.ATLARIX_CORE_MODEL_1 || secrets.ATLARIX_CORE_MODEL_1 }}
  ATLARIX_CORE_MODEL_2: ${{ vars.ATLARIX_CORE_MODEL_2 || secrets.ATLARIX_CORE_MODEL_2 }}
  ATLARIX_CORE_MODEL_3: ${{ vars.ATLARIX_CORE_MODEL_3 || secrets.ATLARIX_CORE_MODEL_3 }}
  ATLARIX_CORE_MODEL_4: ${{ vars.ATLARIX_CORE_MODEL_4 || secrets.ATLARIX_CORE_MODEL_4 }}
  ATLARIX_CORE_MODEL_5: ${{ vars.ATLARIX_CORE_MODEL_5 || secrets.ATLARIX_CORE_MODEL_5 }}
  ATLARIX_CORE_MODEL_6: ${{ vars.ATLARIX_CORE_MODEL_6 || secrets.ATLARIX_CORE_MODEL_6 }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  store-status:
    if: ${{ inputs.store_status }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report the Store's submissions
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          STORE_APP_ID: "9P3RR11DVZPW"
        run: node scripts/store-submit.mjs --status

  msix:
    if: ${{ !inputs.store_status }}
    # One release at a time holds the Store's single pending-submission slot: two
    # tags building at once would each replace the other's submission.
    concurrency:
      group: msstore-submit
      cancel-in-progress: false
    # PINNED, not `windows-latest` — a STOPGAP, and it is on a deprecation path.
    #
    # `windows-latest` resolves to `windows-2025-vs2026`, whose only Visual Studio
    # is 2026 (v18.8.2). @electron/node-gyp@10.2.0-electron.1 knows VS up to 2022
    # (v17) only: it finds the instance, logs "unsupported version: 18", falls
    # through every older check, and reports "Could not find any Visual Studio
    # installation to use" on a machine with a brand-new one.
    #
    # WHY THIS IS NEW, since the image is not: v14.34.0 built green on the SAME
    # vs2026 image and never ran the VS finder at all (`grep -c "find VS"` on its
    # log is 0), because better-sqlite3 came from a PREBUILT binary. Electron 43
    # (ABI 148) with better-sqlite3 12.11.1 has no prebuild, so Windows now
    # compiles from source — the first time this pipeline has invoked that finder,
    # which is why two latent defects in it surfaced at once (the 1 MB maxBuffer,
    # patched, and no VS>=18 support, unpatched).
    #
    # THE PATCH HAS LANDED (v14.43.0+): patches/@electron+node-gyp+10.2.0-electron.1
    # .patch now maps major 18 -> year 2026, adds 2026 to all three supportedYears
    # arrays, and discovers the VC++ toolset from disk. What has NOT happened is a
    # green run on the vs2026 image — nobody has a Windows machine with VS 2026 here,
    # so the patch is unexercised.
    #
    # TO UN-PIN: dispatch this workflow with runner=windows-latest. The
    # "Verify Visual Studio toolchain is discoverable" step prints the versionYear and
    # toolset that were actually selected, which is the assertion to read — NOT the
    # build passing, and not the absence of "unsupported version: 18" from a gyp log
    # that @electron/rebuild swallows on success. Once that dispatch is green, change
    # the two defaults above and release.yml's build-windows to windows-latest.
    #
    # windows-2022 is on a deprecation path and this image is also much colder
    # (~5 min of setup before the build step), so this is a stopgap either way.
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 25 breaks the better-sqlite3 native build on windows-latest
          # (llvm-lib /LTCG:INCREMENTAL). Matches release.yml's build-windows.
          node-version: "24"

      # Guards against a package whose build-time credentials are all empty —
      # it would install fine and fail every spike item that matters, wasting a
      # full round trip to the test machine. Names only; values stay masked.
      - name: Verify build credentials are present
        shell: pwsh
        run: |
          $required = @(
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY",
            "ATLARIX_CORE_PROXY_URL",
            "LEMONSQUEEZY_VARIANT_ID"
          )
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing build-time credentials: $($missing -join ', '). The MSIX would ship with no auth or checkout config, so the behavior spike could not test sign-in or the atlarix://pro-return leg."
            exit 1
          }
          Write-Host "All $($required.Count) required build credentials present."

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ inputs.arch }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          node scripts/verify-npm-lock-registry.mjs
          $attempts = 0
          $maxAttempts = 5
          while ($attempts -lt $maxAttempts) {
            $attempts++
            npm ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci succeeded on attempt $attempts"
              exit 0
            }
            Write-Warning "npm ci failed (attempt $attempts of $maxAttempts); retrying..."
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($attempts * 25)
          }
          Write-Error "npm ci failed after $maxAttempts attempts"
          exit 1

      - name: Verify Forge patch applied
        shell: pwsh
        run: node scripts/verify-forge-patch.mjs

      # Fails FAST, and names what was found.
      #
      # The native rebuild does not happen at `npm ci` — it runs inside
      # forge.config.ts, i.e. at the "Package (electron-forge)" step, several minutes
      # of Vite and Rust later. So without this, a Visual Studio the patched node-gyp
      # cannot see surfaces as a late "Could not find any Visual Studio installation
      # to use", a message that names neither node-gyp nor the patch.
      #
      # It also PRINTS the versionYear and toolset that were selected, which is the
      # only honest way to verify the VS 2026 patch: @electron/rebuild buffers
      # node-gyp's output and prints it only on a non-zero exit, so on a green build
      # there is no log to grep and "assert the absence of `unsupported version: 18`"
      # proves nothing.
      - name: Verify Visual Studio toolchain is discoverable
        shell: pwsh
        run: node scripts/check-vs-toolchain.mjs

      - name: Ensure Electron binary (Windows)
        shell: pwsh
        run: node node_modules/electron/install.js

      - name: Verify Electron distro zip (Windows)
        shell: pwsh
        run: node scripts/win-ci-electron-zip.mjs --verify

      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          $rg = Get-Command rg -ErrorAction SilentlyContinue
          if (-not $rg) {
            Write-Error "rg not on PATH after choco install"
            exit 1
          }
          rg --version

      - name: Prepare packager temp (Windows)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "electron-packager"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.cache/packager-tmp" | Out-Null

      - name: Download Landlock helper for WSL confinement
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: landlock-helper
          path: native/atlarix-sandbox-linux/target/release/
        continue-on-error: true

      # Not continue-on-error: a Store build without the helper must not ship.
      - name: Download Landlock helper from the release run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_resubmit_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: landlock-helper
          path: native/atlarix-sandbox-linux/target/release/
          run-id: ${{ inputs.store_resubmit_run }}
          github-token: ${{ github.token }}

      - name: Build for Windows (Vite)
        shell: pwsh
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npm run clean
          node scripts/win-ci-vite.mjs

      # The AppContainer sandbox helper for agent `run_command`. Unsigned is fine
      # here: inside an MSIX every payload file is covered by the PACKAGE
      # signature, so a per-file cert would add nothing. Non-fatal for a spike
      # build — wrap-command.ts falls back to unsandboxed with a warning, and the
      # helper is validated on a Squirrel install first anyway (see the runbook).
      - name: Build Windows sandbox helper (Rust)
        shell: pwsh
        run: |
          cargo build --release --manifest-path native/atlarix-sandbox/Cargo.toml
          $exe = "native/atlarix-sandbox/target/release/atlarix-sandbox.exe"
          if (Test-Path $exe) {
            Write-Host "Built sandbox helper: $exe"
          } else {
            Write-Host "::warning::atlarix-sandbox.exe failed to build — this MSIX will run run_command UNSANDBOXED. Acceptable for a spike build; do not ship it."
          }

      - name: Build the bridge relay (Rust)
        shell: pwsh
        run: |
          # THE FOURTH BUILD PATH. release.yml has three (macOS, Linux, Windows)
          # and this reusable workflow is the one that gets forgotten — it was,
          # and `verify-ci-package-out` caught it on the v14.46.0 tag run with
          # "missing resource atlarix-bridge.exe ... check the build step for
          # this helper ran", which is exactly what that check is for.
          #
          # Hard failure, unlike the sandbox helper above. That one degrades to
          # an unsandboxed spike build, which is a stated trade; a missing relay
          # is a feature that is silently absent, and absent is indistinguishable
          # from dormant once it has shipped.
          cargo build --release --manifest-path native/atlarix-bridge/Cargo.toml
          $exe = "native/atlarix-bridge/target/release/atlarix-bridge.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::atlarix-bridge.exe failed to build — the MSIX would ship with the browser bridge silently absent."
            exit 1
          }
          Write-Host "Built bridge relay: $exe"

      - name: Build the computer-use executor (Rust)
        shell: pwsh
        run: |
          # The fifth build path; same hard failure as the relay above.
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --manifest-path native/atlarix-computer/Cargo.toml
          $exe = "native/atlarix-computer/target/release/atlarix-computer.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::atlarix-computer.exe failed to build — the MSIX would ship computer use that fails every action."
            exit 1
          }
          Write-Host "Built computer-use executor: $exe"

      - name: Package (electron-forge)
        timeout-minutes: 55
        shell: pwsh
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          TMP: ${{ github.workspace }}/.cache/packager-tmp
          TEMP: ${{ github.workspace }}/.cache/packager-tmp
          # A MANUAL run cannot have the Linux helper, and must not be failed for it.
          #
          # "Download Landlock helper" above is gated to non-dispatch runs, because a
          # standalone run has no `build-linux` to take the artifact from. So on a
          # dispatch `atlarix-sandbox-linux` is absent BY DESIGN — yet it is only
          # waivable via ALLOW_UNSANDBOXED_RELEASE, which nothing set. The result was
          # that every manual run died at this step no matter what it was testing:
          # the windows-2022 un-pin dispatch got VS 2026 discovery, the native
          # rebuild and electron-forge packaging all green, then failed here and
          # never reached "Build MSIX" at all.
          #
          # Scoped to workflow_dispatch. A release arrives as workflow_call with the
          # artifact present, and keeps the strict check — which matters, because
          # shipping a Store build without WSL confinement is exactly what the
          # assertion exists to prevent.
          # A Store re-submit has the helper, so it keeps the strict check too.
          ALLOW_UNSANDBOXED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.store_resubmit_run == '' && '1' || '' }}
        run: |
          node scripts/win-ci-packager-worker.mjs
          if (-not $?) { exit $LASTEXITCODE }
          node scripts/verify-ci-package-out.mjs --stage package --platform win32 --arch ${{ inputs.arch }}

      - name: Build MSIX
        shell: pwsh
        run: |
          # NOT `$args` — that is a PowerShell automatic variable.
          $nodeArgs = @("scripts/make-msix.mjs", "--arch", "${{ inputs.arch }}")
          if ("${{ inputs.upload_wrapper }}" -eq "true" -or "${{ inputs.store_resubmit_run }}" -ne "") { $nodeArgs += "--upload" }
          node @nodeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Submit to the Microsoft Store on release tags. Skipped on manual runs
      # (workflow_dispatch) — a test build must never reach the Store — unless
      # the run is a `store_resubmit_run`.
      # Non-fatal: a submission failure must not block the release.
      - name: Submit to Microsoft Store
        id: store_submit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.store_resubmit_run != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          STORE_APP_ID: "9P3RR11DVZPW"
        run: |
          $msixupload = (Get-ChildItem "out/msix/*.msixupload" | Select-Object -First 1).FullName
          if (-not $msixupload) {
            Write-Host "::warning::No .msixupload found — skipping Store submission."
            exit 0
          }
          $env:MSIXUPLOAD_PATH = $msixupload
          Write-Host "Submitting $msixupload to Microsoft Store..."
          node scripts/store-submit.mjs

      # Uploaded only when it would actually be USED — see the `if:` below.
      #
      # It used to upload on EVERY tag at 14-day retention, and nothing ever
      # downloaded it: Store submission happens in this same job, directly from
      # `out/msix/`, and works. Nine copies at 163-326 MB apiece took the
      # account's 0.5 GB Actions storage to 100% (2026-08-17).
      - name: Upload MSIX artifact
        # A manual build never submits (the step above is tag-only), so there the
        # artifact IS the deliverable. On a tag it appears only when submission
        # actually failed — that step is `continue-on-error`, so the release
        # proceeds and this becomes the only copy of an already-built package.
        # Submission is reliable in practice, so in the normal case this uploads
        # nothing at all.
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.store_resubmit_run == '') || steps.store_submit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlarix-msix-${{ inputs.arch }}
          # The rendered manifest ships alongside so the exact Identity/Publisher
          # that the local signing certificate must match is verifiable without
          # unpacking the .msix.
          path: |
            out/msix/*.msix
            out/msix/*.msixupload
            out/msix/layout-${{ inputs.arch }}/AppxManifest.xml
          if-no-files-found: error
          # Short by design: this now exists only when submission failed or a
          # human asked for a build, and either way it is wanted within a day or
          # two rather than a fortnight.
          retention-days: 2

      - name: Next steps (manual builds only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_resubmit_run == '' }}
        shell: pwsh
        run: |
          Write-Host "MSIX built and uploaded as an artifact (UNSIGNED)."
          Write-Host "Sign and install it on the Windows test machine per docs/MSIX_RUNBOOK.md:"
          Write-Host "  1. Import/generate the test cert (subject MUST be CN=B8A553CE-4E5B-49AD-B077-6973F43EADFD)"
          Write-Host "  2. signtool sign /fd SHA256 ..."
          Write-Host "  3. Add-AppxPackage"
          Write-Host "  4. atlarix.exe --self-test   (with ATLARIX_SELF_TEST_OUT set)"
