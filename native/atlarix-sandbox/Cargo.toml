[package]
name = "atlarix-sandbox"
version = "0.1.0"
edition = "2021"
description = "Windows AppContainer write-confining sandbox helper for Atlarix run_command"
license = "MIT"
publish = false

[[bin]]
name = "atlarix-sandbox"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
]
