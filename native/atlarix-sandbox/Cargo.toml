[package]
name = "atlarix-sandbox"
version = "0.1.0"
edition = "2021"
description = "Windows Low-Integrity write-confining sandbox helper for Atlarix run_command"
license = "MIT"
publish = false

[[bin]]
name = "atlarix-sandbox"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dependencies.windows]
version = "0.58"
features = [
    # LocalFree / HLOCAL / BOOL / HANDLE / CloseHandle all live in Win32_Foundation.
    "Win32_Foundation",
    # Tokens (DuplicateTokenEx, SetTokenInformation, TOKEN_MANDATORY_LABEL),
    # GetSecurityDescriptorSacl, LABEL_SECURITY_INFORMATION.
    "Win32_Security",
    # SDDL conversion + SetNamedSecurityInfoW for the Low mandatory label.
    "Win32_Security_Authorization",
    # OpenProcessToken / GetCurrentProcess / CreateProcessAsUserW.
    "Win32_System_Threading",
    # SE_GROUP_INTEGRITY.
    "Win32_System_SystemServices",
    # SHGetKnownFolderPath + FOLDERID_LocalAppDataLow: the ONLY supported way to
    # locate LocalLow. Windows ships no environment variable for it, and the
    # %USERPROFILE%\AppData\LocalLow shortcut breaks under Folder Redirection.
    "Win32_UI_Shell",
    # CoTaskMemFree, to release the PWSTR SHGetKnownFolderPath allocates.
    "Win32_System_Com",
    # NOTE: Win32_Security_Isolation (AppContainer) was dropped when this helper
    # moved to Low Integrity Level — see the rationale at the top of src/main.rs.
]
