[package]
name = "atlarix-sandbox-linux"
version = "0.1.0"
edition = "2021"
description = "Linux Landlock write-confining sandbox helper for Atlarix run_command"

[[bin]]
name = "atlarix-sandbox-linux"
path = "src/main.rs"

# Tiny static-ish helper (mirrors native/atlarix-sandbox for Windows).
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# This crate does exactly one thing: Landlock write confinement, the shipped
# security boundary. `cargo build --release` builds all of it, which is also what
# CI builds — there is no feature-gated code that no automated process compiles.
#
# The `trace-supervisor` feature (seccomp + ptrace denied-path reporting) and its
# nix/libc/seccompiler deps were DELETED in v14.26.0: 60% of the crate, never
# compiled by CI, never consumed by the app, and improving diagnostics rather than
# security on one OS only. See the note at the top of src/main.rs.

# Linux-only dependencies. The crate body is `#![cfg(target_os = "linux")]`, so on
# any other host it compiles to an empty binary and never pulls landlock.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
