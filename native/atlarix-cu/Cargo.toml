[package]
name = "atlarix-cu"
version = "0.1.0"
edition = "2021"
description = "Atlarix computer-use helper: macOS SPI probe, public-API input fallback, OS-native OCR"
license = "MIT"
publish = false

[[bin]]
name = "atlarix-cu"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dependencies]
serde_json = "1"

# macOS: Vision for OCR, CoreGraphics for the public CGEventPostToPid fallback,
# libc for dlopen/dlsym in the private-SPI probe.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

# Windows: Windows.Media.Ocr. Pinned to the same major as
# native/atlarix-sandbox so the two helpers share one windows-crate version.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    # REQUIRED, and its absence does not read as a missing feature: OcrResult::Lines
    # returns Foundation::Collections::IVectorView<OcrLine>, so without this the
    # METHOD itself is cfg'd out and rustc reports "no method named `Lines`".
    "Foundation_Collections",
]
