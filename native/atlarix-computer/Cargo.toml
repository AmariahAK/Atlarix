[package]
name = "atlarix-computer"
version = "0.1.0"
edition = "2021"
description = "Computer use executor for Atlarix: screenshots + mouse/keyboard over JSON lines on stdio"
license = "MIT"
publish = false

[[bin]]
name = "atlarix-computer"
path = "src/main.rs"

# Same profile as the other helpers. `panic = "abort"` because a panic that
# unwound mid-response would leave a half-written JSON line on stdout and the
# host would read the next reply as garbage.
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Capture: CoreGraphics/ScreenCaptureKit on macOS, GDI/DXGI on Windows, XCB on
# X11 and the xdg-desktop-portal on Wayland.
xcap = "0.9.8"
# Resize + JPEG encode live here, not in the host: the CLI has no image library.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Input: CGEvent on macOS, SendInput on Windows.
[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.6.1"

# Linux: XTest on X11; on Wayland the RemoteDesktop portal through libei.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["x11rb", "libei_tokio"] }

# Windows text goes in by paste: see input.rs "type".
[target.'cfg(windows)'.dependencies]
arboard = "=3.6.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
# Per-monitor DPI awareness, so capture and SendInput share one pixel space.
features = ["Win32_UI_HiDpi"]
