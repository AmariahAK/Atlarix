<!doctype html>
<!-- Manual/E2E fixture: a page that registers WebMCP tools via the
     navigator.modelContext shim injected by preload-browser.ts.
     Open it in the Atlarix browser panel (serve via `npx serve` or python
     http.server — the shim requires an http(s) URL), then in any chat mode:
       list_webmcp_tools  → should show greet + add_numbers from this origin
       call_webmcp_tool({ name: "add_numbers", input: { a: 2, b: 40 } }) → 42 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebMCP Demo Page</title>
  </head>
  <body>
    <h1>WebMCP Demo</h1>
    <p id="status">Checking for navigator.modelContext…</p>
    <ul id="log"></ul>
    <script>
      const status = document.getElementById("status");
      const log = (msg) => {
        const li = document.createElement("li");
        li.textContent = msg;
        document.getElementById("log").appendChild(li);
      };

      if (!navigator.modelContext) {
        status.textContent = "navigator.modelContext NOT available";
      } else {
        status.textContent = "navigator.modelContext available — registering tools";

        navigator.modelContext.registerTool({
          name: "greet",
          description: "Return a greeting for the given name.",
          inputSchema: {
            type: "object",
            properties: { name: { type: "string" } },
            required: ["name"],
          },
          async execute(input) {
            log("greet(" + JSON.stringify(input) + ")");
            return { greeting: "Hello, " + (input.name ?? "world") + "!" };
          },
        });

        navigator.modelContext.registerTool({
          name: "add_numbers",
          description: "Add two numbers and return the sum.",
          annotations: { readOnlyHint: true },
          inputSchema: {
            type: "object",
            properties: { a: { type: "number" }, b: { type: "number" } },
            required: ["a", "b"],
          },
          async execute(input) {
            log("add_numbers(" + JSON.stringify(input) + ")");
            return { sum: Number(input.a) + Number(input.b) };
          },
        });

        navigator.modelContext.addEventListener("toolchange", () =>
          log("toolchange event fired"),
        );
      }
    </script>
  </body>
</html>
